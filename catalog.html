<!doctype html>
<html lang="it">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Pokémon Collection Manager — CATALOG</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="./manifest.webmanifest">

  <meta name="theme-color" content="#0b1220">

  <style>

    .search-box {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px minmax(220px, 320px) auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    }

    .search-box input,
    .search-box select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      background: #0b1220;
      color: #fff;

      font: inherit;
      border-radius: 0;
    }

    .search-box input:focus,
    .search-box select:focus {
      outline: none;
      border-color: #60a5fa;
    }

      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));

    }

    .catalog-card {

      background: #111827;
      padding: 10px;
      cursor: pointer;

      border-color: #60a5fa;

    .catalog-card img {

      background: #0b1220;

    .catalog-name {

      color: #94a3b8;

    .catalog-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .catalog-actions button {
      flex: 1;
      min-width: 70px;
      cursor: pointer;
    }

    .empty-state {
      border: 1px solid #334155;
      padding: 30px;
      color: #94a3b8;
      text-align: center;
      grid-column: 1 / -1;
    }

    .load-more-wrap {
      text-align: center;
      margin-top: 24px;
    }

    .load-more-wrap .btn {
      cursor: pointer;
    }

    @media (max-width: 900px) {

      .search-box {
        grid-template-columns: 1fr 1fr;
      }

    }

    @media (max-width: 600px) {

      .search-box {
        grid-template-columns: 1fr;
      }

    }

  </style>
</head>

<script>


/* =========================================================
   CONFIG
========================================================= */

const API =
  "https://api.tcgdex.net/v2";

const PAGE_SIZE =
  40;


/* =========================================================
   STATE
========================================================= */

let currentLang =
  "it";

let allSets =
  [];

let setsMap =
  {};

let currentPage =
  1;

let currentQuery =
  "";

let currentSetId =
  "";

let loading =
  false;

let hasMore =
  false;

let lastResults =
  [];


/* =========================================================
   ELEMENTS
========================================================= */

const searchInput =
  document.getElementById(
    "searchInput"
  );

const languageSelect =
  document.getElementById(
    "languageSelect"
  );

const setSelect =
  document.getElementById(
    "setSelect"
  );

const searchBtn =
  document.getElementById(
    "searchBtn"
  );

const results =
  document.getElementById(
    "results"
  );

const status =
  document.getElementById(
    "status"
  );

const loadMoreWrap =
  document.getElementById(
    "loadMoreWrap"
  );

const loadMoreBtn =
  document.getElementById(
    "loadMoreBtn"
  );


/* =========================================================
   HELPERS
========================================================= */

function normalize(value) {

  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .trim();

}


function escapeHtml(value) {

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function cardImage(card) {

  if (
    !card ||
    !card.image
  ) {

    return "";

  }

  let image =
    card.image;

  if (
    image.endsWith(".png") ||
    image.endsWith(".jpg") ||
    image.endsWith(".jpeg") ||
    image.endsWith(".webp")
  ) {

    return image;

  }

  return (
    image +
    "/high.webp"
  );

}


function getSetId(card) {

  if (
    card &&
    card.set &&
    card.set.id
  ) {

    return card.set.id;

  }

  if (
    card &&
    card.id
  ) {

    return String(
      card.id
    ).split("-")[0];

  }

  return "";

}


function getSetName(card) {

  const setId =
    getSetId(card);

  if (
    setsMap[setId] &&
    setsMap[setId].name
  ) {

    return setsMap[setId].name;

  }

  if (
    card &&
    card.set &&
    card.set.name
  ) {

    return card.set.name;

  }

  return "Set sconosciuto";

}


/* =========================================================
   LOAD SETS
   Sempre in italiano.
   Così il menu SET resta leggibile anche
   quando selezioniamo EN o JP.
========================================================= */

async function loadSets() {

  try {

    const response =
      await fetch(
        `${API}/it/sets`
      );

    if (!response.ok) {

      throw new Error(
        "Errore caricamento set"
      );

    }

    allSets =
      await response.json();

    setsMap =
      {};

    allSets.forEach(
      set => {

        setsMap[set.id] =
          set;

      }
    );

    populateSetSelect();

  } catch (error) {

    console.error(error);

    status.textContent =
      "Impossibile caricare i set.";

  }

}


/* =========================================================
   SET DROPDOWN
========================================================= */

function populateSetSelect() {

  setSelect.innerHTML =
    `
      <option value="">
        Tutti i set
      </option>
    `;

  const sortedSets =
    [...allSets].sort(
      (a, b) =>
        String(
          a.name || ""
        ).localeCompare(
          String(
            b.name || ""
          ),
          "it"
        )
    );

  sortedSets.forEach(
    set => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        set.id;

      option.textContent =
        set.name ||
        set.id;

      setSelect.appendChild(
        option
      );

    }
  );

}


/* =========================================================
   FIND SET
========================================================= */

function findSetById(id) {

  if (!id) {

    return null;

  }

  return (
    allSets.find(
      set =>
        normalize(
          set.id
        ) ===
        normalize(id)
    ) ||
    null
  );

}


/* =========================================================
   RENDER CARD
========================================================= */

function renderCard(card) {

  const image =
    cardImage(card);

  const name =
    card.name ||
    "Unknown";

  const localId =
    card.localId ||
    "—";

  const setName =
    getSetName(card);

  const cardId =
    card.id ||
    "";

  return `

    <div
      class="catalog-card"
      data-card-id="${escapeHtml(cardId)}"
    >

      ${
        image

          ? `

            <img
              src="${escapeHtml(image)}"
              alt="${escapeHtml(name)}"
              loading="lazy"
            >

          `

          : `

            <div class="fakecard">
              NO IMAGE
            </div>

          `
      }


      <div class="catalog-info">

        <div class="catalog-name">

          ${escapeHtml(name)}

        </div>


        <div class="catalog-meta">

          ${escapeHtml(setName)}

          <br>

          Nº ${escapeHtml(localId)}

        </div>


        <div class="catalog-actions">

          <button
            class="btn secondary view-btn"
            type="button"
            data-card-id="${escapeHtml(cardId)}"
          >
            VIEW
          </button>


          <button
            class="btn add-btn"
            type="button"
            data-card-id="${escapeHtml(cardId)}"
          >
            +
          </button>

        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   RENDER RESULTS
========================================================= */

function renderResults(cards) {

  lastResults =
    cards || [];

  if (
    !lastResults.length
  ) {

    results.innerHTML =
      `
        <div class="empty-state">
          Nessun risultato.
        </div>
      `;

    return;

  }

  results.innerHTML =
    lastResults
      .map(
        card =>
          renderCard(card)
      )
      .join("");

}


/* =========================================================
   GET ITALIAN VERSION
=========================================================

   Gli ID sono gli stessi tra le lingue.
   Quindi prendiamo la carta nella lingua scelta
   e poi recuperiamo la versione italiana per
   mostrare sempre il nome italiano.
========================================================= */

async function getItalianCard(cardId) {

  try {

    const response =
      await fetch(
        `${API}/it/cards/${encodeURIComponent(cardId)}`
      );

    if (!response.ok) {

      return null;

    }

    return await response.json();

  } catch (error) {

    console.error(error);

    return null;

  }

}


/* =========================================================
   LOCALIZE RESULTS
========================================================= */

async function localizeResults(
  cards
) {

  if (
    !cards ||
    !cards.length
  ) {

    return [];

  }

  /*
    Se siamo già in italiano,
    non servono altre chiamate.
  */

  if (
    currentLang === "it"
  ) {

    return cards;

  }


  /*
    Per EN / JP:
    recuperiamo il nome italiano
    usando lo stesso card ID.
  */

  const localized =
    await Promise.all(

      cards.map(
        async card => {

          const italianCard =
            await getItalianCard(
              card.id
            );

          if (
            italianCard
          ) {

            return {
              ...card,

              name:
                italianCard.name,

              /*
                Il set visualizzato
                resta quello italiano.
              */

              set:
                italianCard.set ||
                card.set

            };

          }

          return card;

        }
      )

    );

  return localized;

}


/* =========================================================
   VIEW CARD
========================================================= */

async function viewCard(
  cardId
) {

  if (!cardId) {

    return;

  }

  try {

    const response =
      await fetch(
        `${API}/${currentLang}/cards/${encodeURIComponent(cardId)}`
      );

    if (!response.ok) {

      throw new Error(
        "Card non trovata"
      );

    }

    const card =
      await response.json();

    const italianCard =
      await getItalianCard(
        cardId
      );

    const displayName =
      italianCard?.name ||
      card.name ||
      "Card";

    const setName =
      getSetName(
        italianCard ||
        card
      );

    alert(

      `${displayName}\n\n` +

      `Set: ${setName}\n` +

      `Numero: ${
        card.localId ||
        "—"
      }\n` +

      `Lingua: ${
        currentLang === "it"
          ? "Italiano"
          : currentLang === "en"
            ? "Inglese"
            : "Giapponese"
      }\n\n` +

      `ID: ${
        card.id ||
        cardId
      }`

    );

  } catch (error) {

    console.error(error);

    alert(
      "Impossibile aprire la carta."
    );

  }

}


/* =========================================================
   ADD TO COLLECTION
========================================================= */

function addToCollection(
  cardId
) {

  if (!cardId) {

    return;

  }

  const url =
    `collection.html?add=${encodeURIComponent(cardId)}`;

  window.location.href =
    url;

}


/* =========================================================
   SEARCH GENERAL BY NAME
=========================================================

   IMPORTANTE:
   La ricerca del nome viene fatta
   SEMPRE sull'API italiana.

   Quindi:
   Gengar + JP
   funziona anche se il nome giapponese
   è completamente diverso.
========================================================= */

async function searchByName(
  query,
  page,
  append = false
) {

  status.textContent =
    `Ricerca ${query}...`;

  const params =
    new URLSearchParams();

  params.set(
    "name",
    query
  );

  params.set(
    "pagination:page",
    page
  );

  params.set(
    "pagination:itemsPerPage",
    PAGE_SIZE
  );

  const response =
    await fetch(
      `${API}/it/cards?${params.toString()}`
    );

  if (!response.ok) {

    throw new Error(
      "Errore ricerca nome"
    );

  }

  const data =
    await response.json();

  const cards =
    data.cards ||
    data ||
    [];


  /*
    Ora recuperiamo la versione
    nella lingua scelta.
  */

  const languageCards =
    await Promise.all(

      cards.map(
        async card => {

          if (
            currentLang === "it"
          ) {

            return card;

          }

          try {

            const response =
              await fetch(
                `${API}/${currentLang}/cards/${encodeURIComponent(card.id)}`
              );

            if (
              response.ok
            ) {

              return await response.json();

            }

          } catch (
            error
          ) {

            console.error(
              error
            );

          }

          return null;

        }
      )

    );


  const validCards =
    languageCards.filter(
      Boolean
    );


  /*
    Aggiungiamo il nome italiano.
  */

  const finalCards =
    await localizeResults(
      validCards
    );


  if (append) {

    lastResults =
      lastResults.concat(
        finalCards
      );

  } else {

    lastResults =
      finalCards;

  }


  renderResults(
    lastResults
  );


  hasMore =
    cards.length ===
    PAGE_SIZE;

  loadMoreWrap.style.display =
    hasMore
      ? "block"
      : "none";


  status.textContent =
    `${lastResults.length} risultati`;

}


/* =========================================================
   SEARCH BY NUMBER
=========================================================

   Esempio:
   154

   Prima cerchiamo il numero nella lingua
   selezionata, poi recuperiamo il nome italiano.
========================================================= */

async function searchByNumber(
  number,
  page,
  append = false
) {

  status.textContent =
    `Ricerca carta numero ${number}...`;


  const params =
    new URLSearchParams();


  /*
    TCGdex:
    localId=154
  */

  params.set(
    "localId",
    number
  );


  params.set(
    "pagination:page",
    page
  );


  params.set(
    "pagination:itemsPerPage",
    PAGE_SIZE
  );


  const response =
    await fetch(
      `${API}/${currentLang}/cards?${params.toString()}`
    );


  if (!response.ok) {

    throw new Error(
      "Errore ricerca numero"
    );

  }


  const data =
    await response.json();


  const cards =
    data.cards ||
    data ||
    [];


  /*
    Recuperiamo i nomi italiani.
  */

  const finalCards =
    await localizeResults(
      cards
    );


  if (append) {

    lastResults =
      lastResults.concat(
        finalCards
      );

  } else {

    lastResults =
      finalCards;

  }


  renderResults(
    lastResults
  );


  hasMore =
    cards.length ===
    PAGE_SIZE;


  loadMoreWrap.style.display =
    hasMore
      ? "block"
      : "none";


  status.textContent =
    `${lastResults.length} carte numerate ${number}`;

}


/* =========================================================
   SEARCH INSIDE SET
========================================================= */

async function searchInsideSet(
  query,
  setId
) {

  status.textContent =
    "Ricerca nel set...";

  loadMoreWrap.style.display =
    "none";


  const set =
    findSetById(
      setId
    );


  if (!set) {

    renderResults([]);

    status.textContent =
      "Set non trovato.";

    return;

  }


  try {

    /*
      Recuperiamo il set
      nella lingua selezionata.
    */

    const response =
      await fetch(
        `${API}/${currentLang}/sets/${encodeURIComponent(set.id)}`
      );


    if (!response.ok) {

      throw new Error(
        "Set non trovato"
      );

    }


    const fullSet =
      await response.json();


    let cards =
      fullSet.cards ||
      [];


    const wanted =
      normalize(
        query
      );


    /*
      Se abbiamo scritto qualcosa:
      nome italiano oppure numero.
    */

    if (wanted) {

      /*
        Se è un numero,
        confronto esatto localId.
      */

      if (
        /^\d+$/.test(
          wanted
        )
      ) {

        cards =
          cards.filter(
            card =>
              String(
                card.localId
              ) ===
              String(
                wanted
              )
          );

      } else {

        /*
          Per il nome:
          recuperiamo le informazioni
          italiane per confrontare
          il nome corretto.
        */

        const italianCards =
          await Promise.all(

            cards.map(
              card =>
                getItalianCard(
                  card.id
                )
            )

          );


        const matchingIds =
          new Set();


        italianCards.forEach(
          italianCard => {

            if (
              italianCard &&
              normalize(
                italianCard.name
              ).includes(
                wanted
              )
            ) {

              matchingIds.add(
                italianCard.id
              );

            }

          }
        );


        cards =
          cards.filter(
            card =>
              matchingIds.has(
                card.id
              )
          );

      }

    }


    /*
      Convertiamo i risultati
      con nome/set italiani.
    */

    const finalCards =
      await localizeResults(
        cards
      );


    lastResults =
      finalCards;


    renderResults(
      finalCards
    );


    status.textContent =
      `${finalCards.length} risultati in ${set.name}`;

  } catch (error) {

    console.error(
      error
    );

    renderResults([]);

    status.textContent =
      "Errore nella ricerca del set.";

  }

}


/* =========================================================
   EXACT CARD ID
========================================================= */

async function searchExactCard(
  query
) {

  /*
    Esempio:
    me55-154
  */

  if (
    !query.includes("-") ||
    query.includes(" ")
  ) {

    return false;

  }


  try {

    const response =
      await fetch(
        `${API}/${currentLang}/cards/${encodeURIComponent(query)}`
      );


    if (!response.ok) {

      return false;

    }


    const card =
      await response.json();


    const finalCard =
      (
        await localizeResults(
          [card]
        )
      )[0];


    renderResults([
      finalCard
    ]);


    status.textContent =
      "1 risultato";


    loadMoreWrap.style.display =
      "none";


    return true;

  } catch (
    error
  ) {

    console.error(
      error
    );

    return false;

  }

}


/* =========================================================
   MAIN SEARCH
========================================================= */

async function searchCards() {

  if (loading) {

    return;

  }


  loading =
    true;


  currentQuery =
    searchInput.value.trim();


  currentSetId =
    setSelect.value;


  currentLang =
    languageSelect.value;


  currentPage =
    1;


  lastResults =
    [];


  loadMoreWrap.style.display =
    "none";


  results.innerHTML =
    "";


  const query =
    currentQuery;


  const setId =
    currentSetId;


  try {


    /*
      NESSUN TESTO + SET
      -> tutto il set
    */

    if (
      !query &&
      setId
    ) {

      await searchInsideSet(
        "",
        setId
      );

      return;

    }


    /*
      NIENTE
    */

    if (
      !query &&
      !setId
    ) {

      status.textContent =
        "Inserisci un nome o un numero.";

      renderResults([]);

      return;

    }


    /*
      ID PRECISO
      Esempio:
      me55-154
    */

    if (
      query.includes("-") &&
      !query.includes(" ")
    ) {

      const found =
        await searchExactCard(
          query
        );


      if (found) {

        return;

      }

    }


    /*
      SET + NUMERO
      oppure
      SET + NOME
    */

    if (setId) {

      await searchInsideSet(
        query,
        setId
      );

      return;

    }


    /*
      NUMERO PURO
      Esempio:
      154
    */

    if (
      /^\d+$/.test(
        query
      )
    ) {

      await searchByNumber(
        query,
        1,
        false
      );

      return;

    }


    /*
      NOME
      Esempio:
      Gengar
      Pikachu
      Charizard
    */

    await searchByName(
      query,
      1,
      false
    );

  } catch (
    error
  ) {

    console.error(
      error
    );

    renderResults([]);

    status.textContent =
      "Errore durante la ricerca.";

  } finally {

    loading =
      false;

  }

}


/* =========================================================
   LOAD MORE
========================================================= */

async function loadMore() {

  if (
    loading ||
    !hasMore
  ) {

    return;

  }


  loading =
    true;


  try {

    currentPage++;


    const query =
      currentQuery;


    const setId =
      currentSetId;


    /*
      Se abbiamo un SET,
      i risultati del set sono
      già stati caricati tutti.
    */

    if (setId) {

      hasMore =
        false;

      loadMoreWrap.style.display =
        "none";

      return;

    }


    /*
      NUMERO
    */

    if (
      /^\d+$/.test(
        query
      )
    ) {

      await searchByNumber(
        query,
        currentPage,
        true
      );

      return;

    }


    /*
      NOME
    */

    await searchByName(
      query,
      currentPage,
      true
    );

  } catch (
    error
  ) {

    console.error(
      error
    );

    currentPage--;

    status.textContent =
      "Errore nel caricamento.";

  } finally {

    loading =
      false;

  }

}


/* =========================================================
   EVENTS
========================================================= */

searchBtn.addEventListener(
  "click",
  searchCards
);


searchInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key ===
      "Enter"
    ) {

      searchCards();

    }

  }
);


/*
  Cambiando lingua:
  se c'è già una ricerca,
  la ripete automaticamente.
*/

languageSelect.addEventListener(
  "change",
  () => {

    if (
      searchInput.value.trim() ||
      setSelect.value
    ) {

      searchCards();

    }

  }
);


/*
  Cambiando set:
  la ricerca viene aggiornata.
*/

setSelect.addEventListener(
  "change",
  () => {

    if (
      searchInput.value.trim() ||
      setSelect.value
    ) {

      searchCards();

    }

  }
);


/*
  LOAD MORE
*/

loadMoreBtn.addEventListener(
  "click",
  loadMore
);


/*
  CLICK SULLE CARTE
*/

results.addEventListener(
  "click",
  event => {


    const viewButton =
      event.target.closest(
        ".view-btn"
      );


    if (viewButton) {

      event.stopPropagation();

      viewCard(
        viewButton.dataset.cardId
      );

      return;

    }


    const addButton =
      event.target.closest(
        ".add-btn"
      );


    if (addButton) {

      event.stopPropagation();

      addToCollection(
        addButton.dataset.cardId
      );

      return;

    }


    const card =
      event.target.closest(
        ".catalog-card"
      );


    if (card) {

      viewCard(
        card.dataset.cardId
      );

    }

  }
);


/* =========================================================
   INIT
========================================================= */

(async function init() {

  await loadSets();

})();


/* =========================================================
   SERVICE WORKER
========================================================= */

if (
  "serviceWorker" in navigator &&
  location.protocol !== "file:"
) {

  navigator.serviceWorker
    .register(
      "./sw.js?v=9"
    )
    .catch(
      () => {}
    );

}

</script>
