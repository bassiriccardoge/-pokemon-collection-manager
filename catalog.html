<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pokémon Collection Manager — CATALOG</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0b1220">

  <style>
    .search-box {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 320px) auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box input,
    .search-box select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      background: #0b1220;
      color: #fff;
      border: 1px solid #334155;
      font: inherit;
      border-radius: 0;
    }

    .search-box input:focus,
    .search-box select:focus {
      outline: none;
      border-color: #60a5fa;
    }

    .search-label {
      display: block;
      margin-bottom: 6px;
      font-size: 11px;
      letter-spacing: 1px;
      color: #94a3b8;
    }

    .search-field {
      min-width: 0;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .catalog-card {
      border: 1px solid #334155;
      background: #111827;
      padding: 10px;
      cursor: pointer;
    }

    .catalog-card:hover {
      border-color: #60a5fa;
    }

    .catalog-card img {
      width: 100%;
      display: block;
      aspect-ratio: 0.716;
      object-fit: contain;
      background: #0b1220;
    }

    .catalog-info {
      padding-top: 10px;
    }

    .catalog-name {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .catalog-meta {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
    }

    .catalog-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .catalog-actions button {
      flex: 1;
      min-width: 70px;
      cursor: pointer;
    }

    .empty-state {
      border: 1px solid #334155;
      padding: 30px;
      color: #94a3b8;
      text-align: center;
    }

    .load-more-wrap {
      text-align: center;
      margin-top: 24px;
    }

    .load-more-wrap .btn {
      cursor: pointer;
    }

    @media (max-width: 800px) {
      .search-box {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <aside class="side">
    <div class="logo">
      POKÉMON CM
      <small>COLLECTION MANAGER · V1.3</small>
    </div>

    <nav class="nav">
      <a href="index.html">▶ DASHBOARD</a>
      <a href="collection.html">▣ COLLECTION</a>
      <a href="catalog.html">▥ CATALOG</a>
      <a href="masterset.html">▤ MASTERSET</a>
      <a href="wishlist.html">♡ WISHLIST</a>
      <a href="market.html">⌁ MARKET</a>
    </nav>
  </aside>

  <main class="main">

    <div class="top">
      <div>
        <div class="title">CATALOG</div>
        <div class="tag">TCGDEX // CARD DATABASE</div>
      </div>

      <a class="btn" href="collection.html#add">+ ADD CARD</a>
    </div>

    <div class="section">

      <h2>SEARCH</h2>

      <div class="panel">

        <div class="search-box">

          <div class="search-field">
            <label class="search-label" for="searchInput">
              CARD / NUMBER
            </label>

            <input
              id="searchInput"
              type="text"
              placeholder="Es. Gengar, Pikachu, 154..."
              autocomplete="off"
            >
          </div>

          <div class="search-field">
            <label class="search-label" for="setSelect">
              SET
            </label>

            <select id="setSelect">
              <option value="">Tutti i set</option>
            </select>
          </div>

          <div class="search-field" style="align-self:end;">
            <button
              id="searchBtn"
              class="btn"
              type="button"
            >
              SEARCH
            </button>
          </div>

        </div>

        <div
          id="status"
          class="notice"
        >
          Inserisci il nome o il numero della carta.
        </div>

      </div>

    </div>

    <div class="section">

      <h2>RESULTS</h2>

      <div id="results" class="results-grid"></div>

      <div
        id="loadMoreWrap"
        class="load-more-wrap"
        style="display:none;"
      >
        <button
          id="loadMoreBtn"
          class="btn secondary"
          type="button"
        >
          LOAD MORE
        </button>
      </div>

    </div>

  </main>
</div>

<nav class="mobile">
  <a href="index.html">⌂<br>DASH</a>
  <a href="collection.html">▣<br>COLL</a>
  <a href="catalog.html">▥<br>CAT</a>
  <a href="masterset.html">▤<br>SET</a>
  <a href="wishlist.html">♡<br>WISH</a>
  <a href="market.html">⌁<br>MARKET</a>
</nav>


<script>

const API = "https://api.tcgdex.net/v2";

const PAGE_SIZE = 40;

let currentLang = "it";

let allSets = [];
let setsMap = {};

let currentPage = 1;
let currentQuery = "";
let currentSetId = "";

let loading = false;
let hasMore = false;

let lastResults = [];


const searchInput =
  document.getElementById("searchInput");

const setSelect =
  document.getElementById("setSelect");

const searchBtn =
  document.getElementById("searchBtn");

const results =
  document.getElementById("results");

const status =
  document.getElementById("status");

const loadMoreWrap =
  document.getElementById("loadMoreWrap");

const loadMoreBtn =
  document.getElementById("loadMoreBtn");


function normalize(value) {

  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();

}


function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function cardImage(card) {

  if (!card || !card.image) {
    return "";
  }

  let image = card.image;

  if (!image) {
    return "";
  }

  if (
    image.endsWith(".png") ||
    image.endsWith(".jpg") ||
    image.endsWith(".jpeg")
  ) {
    return image;
  }

  return image + "/high.webp";

}


function getSetId(card) {

  if (card?.set?.id) {
    return card.set.id;
  }

  if (card?.id) {
    return String(card.id).split("-")[0];
  }

  return "";

}


function getSetName(card) {

  if (card?.set?.name) {
    return card.set.name;
  }

  const id = getSetId(card);

  if (setsMap[id]?.name) {
    return setsMap[id].name;
  }

  return "Set sconosciuto";

}


async function loadSets() {

  try {

    const response =
      await fetch(
        `${API}/${currentLang}/sets`
      );

    if (!response.ok) {
      throw new Error("Errore caricamento set");
    }

    allSets = await response.json();

    setsMap = {};

    allSets.forEach(set => {

      setsMap[set.id] = set;

    });

    populateSetSelect();

  } catch (error) {

    console.error(error);

    status.textContent =
      "Impossibile caricare i set.";

  }

}


function populateSetSelect() {

  setSelect.innerHTML =
    `<option value="">Tutti i set</option>`;

  const sortedSets =
    [...allSets].sort((a, b) =>
      String(a.name || "")
        .localeCompare(
          String(b.name || ""),
          "it"
        )
    );

  sortedSets.forEach(set => {

    const option =
      document.createElement("option");

    option.value = set.id;

    option.textContent =
      set.name || set.id;

    setSelect.appendChild(option);

  });

}


function findSetById(id) {

  if (!id) {
    return null;
  }

  return (
    allSets.find(
      set => normalize(set.id) === normalize(id)
    ) || null
  );

}


function findSetByExactName(name) {

  if (!name) {
    return null;
  }

  const wanted =
    normalize(name);

  return (
    allSets.find(
      set => normalize(set.name) === wanted
    ) || null
  );

}


function renderCard(card) {

  const image =
    cardImage(card);

  const name =
    card.name || "Unknown";

  const localId =
    card.localId || "—";

  const setName =
    getSetName(card);

  const cardId =
    card.id || "";

  return `
    <div
      class="catalog-card"
      data-card-id="${escapeHtml(cardId)}"
    >

      ${
        image
          ? `<img
               src="${escapeHtml(image)}"
               alt="${escapeHtml(name)}"
               loading="lazy"
             >`
          : `<div class="fakecard">
               NO IMAGE
             </div>`
      }

      <div class="catalog-info">

        <div class="catalog-name">
          ${escapeHtml(name)}
        </div>

        <div class="catalog-meta">
          ${escapeHtml(setName)}
          <br>
          Nº ${escapeHtml(localId)}
        </div>

        <div class="catalog-actions">

          <button
            class="btn secondary view-btn"
            type="button"
            data-card-id="${escapeHtml(cardId)}"
          >
            VIEW
          </button>

          <button
            class="btn add-btn"
            type="button"
            data-card-id="${escapeHtml(cardId)}"
          >
            +
          </button>

        </div>

      </div>

    </div>
  `;

}


function renderResults(cards) {

  lastResults = cards || [];

  if (!lastResults.length) {

    results.innerHTML =
      `<div class="empty-state">
        Nessun risultato.
      </div>`;

    return;

  }

  results.innerHTML =
    lastResults
      .map(card => renderCard(card))
      .join("");

}


async function viewCard(cardId) {

  if (!cardId) {
    return;
  }

  try {

    const response =
      await fetch(
        `${API}/${currentLang}/cards/${encodeURIComponent(cardId)}`
      );

    if (!response.ok) {
      throw new Error("Card non trovata");
    }

    const card =
      await response.json();

    const setName =
      getSetName(card);

    alert(
      `${card.name || "Card"}\n\n` +
      `Set: ${setName}\n` +
      `Numero: ${card.localId || "—"}\n` +
      `ID: ${card.id || cardId}`
    );

  } catch (error) {

    console.error(error);

    alert("Impossibile aprire la carta.");

  }

}


function addToCollection(cardId) {

  if (!cardId) {
    return;
  }

  const url =
    `collection.html?add=${encodeURIComponent(cardId)}`;

  window.location.href = url;

}


async function loadGeneralPage(
  query,
  page,
  append = false
) {

  const params =
    new URLSearchParams();

  params.set("name", `contains:${query}`);
  params.set("pagination:page", page);
  params.set(
    "pagination:itemsPerPage",
    PAGE_SIZE
  );

  const response =
    await fetch(
      `${API}/${currentLang}/cards?${params.toString()}`
    );

  if (!response.ok) {
    throw new Error("Errore ricerca");
  }

  const data =
    await response.json();

  const cards =
    data.cards || data || [];

  if (append) {

    lastResults =
      lastResults.concat(cards);

  } else {

    lastResults =
      cards;

  }

  renderResults(lastResults);

  hasMore =
    cards.length === PAGE_SIZE;

  loadMoreWrap.style.display =
    hasMore ? "block" : "none";

  status.textContent =
    `${lastResults.length} risultati`;

}


async function loadNumberPage(
  number,
  page,
  append = false
) {

  const params =
    new URLSearchParams();

  params.set(
    "localId",
    `eq:${number}`
  );

  params.set(
    "pagination:page",
    page
  );

  params.set(
    "pagination:itemsPerPage",
    PAGE_SIZE
  );

  const response =
    await fetch(
      `${API}/${currentLang}/cards?${params.toString()}`
    );

  if (!response.ok) {
    throw new Error("Errore ricerca numero");
  }

  const data =
    await response.json();

  const cards =
    data.cards || data || [];

  if (append) {

    lastResults =
      lastResults.concat(cards);

  } else {

    lastResults =
      cards;

  }

  renderResults(lastResults);

  hasMore =
    cards.length === PAGE_SIZE;

  loadMoreWrap.style.display =
    hasMore ? "block" : "none";

  status.textContent =
    `${lastResults.length} carte numerate ${number}`;

}


async function searchInsideSet(
  query,
  setId
) {

  status.textContent =
    "Ricerca nel set...";

  loadMoreWrap.style.display =
    "none";

  const set =
    findSetById(setId);

  if (!set) {

    renderResults([]);

    status.textContent =
      "Set non trovato.";

    return;

  }

  try {

    const response =
      await fetch(
        `${API}/${currentLang}/sets/${encodeURIComponent(set.id)}`
      );

    if (!response.ok) {
      throw new Error("Set non trovato");
    }

    const fullSet =
      await response.json();

    let cards =
      fullSet.cards || [];

    const wanted =
      normalize(query);

    if (wanted) {

      cards =
        cards.filter(card => {

          const name =
            normalize(card.name);

          const localId =
            normalize(card.localId);

          return (
            name.includes(wanted) ||
            localId === wanted
          );

        });

    }

    lastResults = cards;

    renderResults(cards);

    status.textContent =
      `${cards.length} risultati in ${set.name}`;

  } catch (error) {

    console.error(error);

    renderResults([]);

    status.textContent =
      "Errore nella ricerca del set.";

  }

}


async function searchExactCard(
  query
) {

  let cardId =
    query;

  if (
    !query.includes("-")
  ) {
    return false;
  }

  const response =
    await fetch(
      `${API}/${currentLang}/cards/${encodeURIComponent(cardId)}`
    );

  if (!response.ok) {
    return false;
  }

  const card =
    await response.json();

  renderResults([card]);

  status.textContent =
    "1 risultato";

  loadMoreWrap.style.display =
    "none";

  return true;

}


async function searchCards() {

  if (loading) {
    return;
  }

  loading = true;

  currentQuery =
    searchInput.value.trim();

  currentSetId =
    setSelect.value;

  currentPage = 1;

  lastResults = [];

  loadMoreWrap.style.display =
    "none";

  results.innerHTML = "";

  const query =
    currentQuery;

  const setId =
    currentSetId;

  try {

    /*
      CASO 1
      Nessuna ricerca + SET selezionato
      -> mostra tutte le carte del set
    */

    if (!query && setId) {

      await searchInsideSet(
        "",
        setId
      );

      return;

    }


    /*
      CASO 2
      Nessun testo e nessun set
    */

    if (!query && !setId) {

      status.textContent =
        "Inserisci un nome o un numero.";

      renderResults([]);

      return;

    }


    /*
      CASO 3
      ID preciso tipo:
      me55-154
      sv01-001
      ecc.
    */

    if (
      query.includes("-") &&
      !query.includes(" ")
    ) {

      const found =
        await searchExactCard(query);

      if (found) {
        return;
      }

    }


    /*
      CASO 4
      SET selezionato
      -> ricerca direttamente dentro il set
    */

    if (setId) {

      await searchInsideSet(
        query,
        setId
      );

      return;

    }


    /*
      CASO 5
      Numero puro
      Es. 154
      -> tutte le carte numerate 154
    */

    if (
      /^\d+$/.test(query)
    ) {

      await loadNumberPage(
        query,
        1,
        false
      );

      return;

    }


    /*
      CASO 6
      Ricerca per nome
      Es. Gengar
      Pikachu
      Charizard
    */

    await loadGeneralPage(
      query,
      1,
      false
    );

  } catch (error) {

    console.error(error);

    renderResults([]);

    status.textContent =
      "Errore durante la ricerca.";

  } finally {

    loading = false;

  }

}


async function loadMore() {

  if (
    loading ||
    !hasMore
  ) {
    return;
  }

  loading = true;

  try {

    currentPage++;

    const query =
      currentQuery;

    const setId =
      currentSetId;

    if (
      setId
    ) {

      await searchInsideSet(
        query,
        setId
      );

      hasMore = false;

      loadMoreWrap.style.display =
        "none";

      return;

    }


    if (
      /^\d+$/.test(query)
    ) {

      await loadNumberPage(
        query,
        currentPage,
        true
      );

      return;

    }


    await loadGeneralPage(
      query,
      currentPage,
      true
    );

  } catch (error) {

    console.error(error);

    currentPage--;

    status.textContent =
      "Errore nel caricamento.";

  } finally {

    loading = false;

  }

}


searchBtn.addEventListener(
  "click",
  searchCards
);


searchInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      searchCards();

    }

  }
);


setSelect.addEventListener(
  "change",
  () => {

    /*
      Se cambio set mentre
      ho già scritto qualcosa,
      lancio automaticamente
      la nuova ricerca.
    */

    if (
      searchInput.value.trim() ||
      setSelect.value
    ) {

      searchCards();

    }

  }
);


loadMoreBtn.addEventListener(
  "click",
  loadMore
);


results.addEventListener(
  "click",
  event => {

    const viewButton =
      event.target.closest(
        ".view-btn"
      );

    if (viewButton) {

      event.stopPropagation();

      viewCard(
        viewButton.dataset.cardId
      );

      return;

    }


    const addButton =
      event.target.closest(
        ".add-btn"
      );

    if (addButton) {

      event.stopPropagation();

      addToCollection(
        addButton.dataset.cardId
      );

      return;

    }


    const card =
      event.target.closest(
        ".catalog-card"
      );

    if (card) {

      viewCard(
        card.dataset.cardId
      );

    }

  }
);


/*
  INIT
*/

(async function init() {

  await loadSets();

})();


if (
  "serviceWorker" in navigator &&
  location.protocol !== "file:"
) {

  navigator.serviceWorker
    .register("./sw.js?v=8")
    .catch(() => {});

}

</script>

</body>
</html>
