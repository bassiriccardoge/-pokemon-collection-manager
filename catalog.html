<script>

const API =
  "https://api.tcgdex.net/v2";

const PAGE_SIZE =
  40;

const WISHLIST_KEY =
  "pcm_wishlist";


/* =========================================================
   STATE
========================================================= */

let currentLang =
  "it";

let allSets =
  [];

let setsMap =
  {};

let currentPage =
  1;

let currentQuery =
  "";

let currentSetId =
  "";

let loading =
  false;

let hasMore =
  false;

let lastResults =
  [];


/* =========================================================
   ELEMENTS
========================================================= */

const searchInput =
  document.getElementById(
    "searchInput"
  );

const languageSelect =
  document.getElementById(
    "languageSelect"
  );

const setSelect =
  document.getElementById(
    "setSelect"
  );

const searchBtn =
  document.getElementById(
    "searchBtn"
  );

const results =
  document.getElementById(
    "results"
  );

const status =
  document.getElementById(
    "status"
  );

const loadMoreWrap =
  document.getElementById(
    "loadMoreWrap"
  );

const loadMoreBtn =
  document.getElementById(
    "loadMoreBtn"
  );


/* =========================================================
   HELPERS
========================================================= */

function normalize(value) {

  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .trim();

}


function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function cardImage(card) {

  if (
    !card ||
    !card.image
  ) {
    return "";
  }

  let image =
    card.image;

  if (
    image.endsWith(".png") ||
    image.endsWith(".jpg") ||
    image.endsWith(".jpeg") ||
    image.endsWith(".webp")
  ) {
    return image;
  }

  return image + "/high.webp";

}


function getSetId(card) {

  if (
    card &&
    card.set &&
    card.set.id
  ) {
    return card.set.id;
  }

  if (
    card &&
    card.id
  ) {
    return String(
      card.id
    ).split("-")[0];
  }

  return "";

}


function getSetName(card) {

  const setId =
    getSetId(card);

  if (
    setsMap[setId] &&
    setsMap[setId].name
  ) {
    return setsMap[setId].name;
  }

  if (
    card &&
    card.set &&
    card.set.name
  ) {
    return card.set.name;
  }

  return "Set sconosciuto";

}


function languageName(lang) {

  if (lang === "it") {
    return "Italiano";
  }

  if (lang === "en") {
    return "Inglese";
  }

  if (lang === "ja") {
    return "Giapponese";
  }

  return lang;

}


/* =========================================================
   WISHLIST
========================================================= */

function getWishlist() {

  try {

    return JSON.parse(
      localStorage.getItem(
        WISHLIST_KEY
      ) || "[]"
    );

  } catch {

    return [];

  }

}


function saveWishlist(items) {

  localStorage.setItem(
    WISHLIST_KEY,
    JSON.stringify(items)
  );

}


function addToWishlist(card) {

  if (
    !card ||
    !card.id
  ) {
    return;
  }


  const wishlist =
    getWishlist();


  const language =
    card.displayLanguage ||
    currentLang;


  const exists =
    wishlist.some(
      item =>

        String(
          item.cardId ||
          item.id
        ) ===
        String(
          card.id
        )

        &&

        String(
          item.language ||
          "it"
        ) ===
        String(
          language
        )
    );


  if (exists) {

    status.textContent =
      "Carta già presente nella Wishlist.";

    return;

  }


  const wishlistCard = {

    id:
      `${card.id}-${language}-${Date.now()}`,

    cardId:
      card.id,

    name:
      card.name ||
      "Carta senza nome",

    localId:
      card.localId ||
      "",

    set:
      card.set ||
      null,

    setName:
      getSetName(card),

    language:
      language,

    image:
      cardImage(card),

    addedAt:
      new Date().toISOString()

  };


  wishlist.push(
    wishlistCard
  );


  saveWishlist(
    wishlist
  );


  status.textContent =
    `${wishlistCard.name} aggiunta alla Wishlist.`;

}


/* =========================================================
   LOAD SETS
========================================================= */

async function loadSets(
  language = currentLang
) {

  try {

    status.textContent =
      `Caricamento set ${languageName(language)}...`;


    const response =
      await fetch(
        `${API}/${language}/sets`
      );


    if (!response.ok) {

      throw new Error(
        "Errore caricamento set"
      );

    }


    allSets =
      await response.json();


    setsMap =
      {};


    allSets.forEach(
      set => {

        setsMap[set.id] =
          set;

      }
    );


    populateSetSelect();


    status.textContent =
      "Inserisci il nome o il numero della carta.";

  } catch (error) {

    console.error(
      "Errore caricamento set:",
      error
    );


    allSets =
      [];


    setsMap =
      {};


    setSelect.innerHTML =
      `
        <option value="">
          Tutti i set
        </option>
      `;


    status.textContent =
      `Impossibile caricare i set ${languageName(language)}.`;

  }

}


/* =========================================================
   SET DROPDOWN
========================================================= */

function populateSetSelect() {

  setSelect.innerHTML =
    `
      <option value="">
        Tutti i set
      </option>
    `;


  const sortedSets =
    [...allSets].sort(
      (a, b) =>
        String(
          a.name || ""
        ).localeCompare(
          String(
            b.name || ""
          ),
          currentLang === "ja"
            ? "ja"
            : "it"
        )
    );


  sortedSets.forEach(
    set => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        set.id;


      option.textContent =
        set.name ||
        set.id;


      setSelect.appendChild(
        option
      );

    }
  );

}


function findSetById(id) {

  if (!id) {
    return null;
  }

  return (
    allSets.find(
      set =>
        normalize(
          set.id
        ) ===
        normalize(id)
    ) ||
    null
  );

}


/* =========================================================
   GET ITALIAN CARD
========================================================= */

async function getItalianCard(cardId) {

  if (!cardId) {
    return null;
  }

  try {

    const response =
      await fetch(
        `${API}/it/cards/${encodeURIComponent(cardId)}`
      );


    if (!response.ok) {
      return null;
    }


    return await response.json();

  } catch (error) {

    console.error(
      "Italian card error:",
      error
    );

    return null;

  }

}


/* =========================================================
   GET CARD IN SELECTED LANGUAGE
========================================================= */

async function getLanguageCard(
  cardId,
  language
) {

  if (!cardId) {
    return null;
  }

  try {

    const response =
      await fetch(
        `${API}/${language}/cards/${encodeURIComponent(cardId)}`
      );


    if (!response.ok) {
      return null;
    }


    return await response.json();

  } catch (error) {

    console.error(
      "Language card error:",
      language,
      cardId,
      error
    );

    return null;

  }

}


/* =========================================================
   LOCALIZE ONE CARD
========================================================= */

async function localizeOneCard(
  card,
  language = currentLang
) {

  if (!card) {
    return null;
  }


  if (
    language === "it"
  ) {

    return {
      ...card,
      displayLanguage: "it"
    };

  }


  const italianCard =
    await getItalianCard(
      card.id
    );


  if (italianCard) {

    return {
      ...card,

      name:
        italianCard.name ||
        card.name,

      displayLanguage:
        language
    };

  }


  return {
    ...card,
    displayLanguage:
      language
  };

}


/* =========================================================
   LOCALIZE RESULTS
========================================================= */

async function localizeResults(
  cards
) {

  if (
    !cards ||
    !cards.length
  ) {
    return [];
  }


  const localized =
    await Promise.all(
      cards.map(
        card =>
          localizeOneCard(
            card,
            currentLang
          )
      )
    );


  return localized.filter(
    Boolean
  );

}


/* =========================================================
   RENDER CARD
========================================================= */

function renderCard(card) {

  const image =
    cardImage(card);

  const name =
    card.name ||
    "Unknown";

  const localId =
    card.localId ||
    "—";

  const setName =
    getSetName(card);

  const cardId =
    card.id ||
    "";


  return `

    <div
      class="catalog-card"
      data-card-id="${escapeHtml(cardId)}"
    >

      ${
        image
          ? `
            <img
              src="${escapeHtml(image)}"
              alt="${escapeHtml(name)}"
              loading="lazy"
            >
          `
          : `
            <div class="fakecard">
              NO IMAGE
            </div>
          `
      }

      <div class="catalog-info">

        <div class="catalog-name">
          ${escapeHtml(name)}
        </div>

        <div class="catalog-meta">

          ${escapeHtml(setName)}

          <br>

          Nº ${escapeHtml(localId)}

          <br>

          ${escapeHtml(
            languageName(
              card.displayLanguage ||
              currentLang
            )
          )}

        </div>

        <div class="catalog-actions">

          <button
            class="btn secondary view-btn"
            type="button"
            data-card-id="${escapeHtml(cardId)}"
          >
            VIEW
          </button>

          <button
            class="btn wish-btn"
            type="button"
            data-card-id="${escapeHtml(cardId)}"
          >
            ♡ WISH
          </button>

          <button
            class="btn add-btn"
            type="button"
            data-card-id="${escapeHtml(cardId)}"
          >
            + COLL
          </button>

        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   RENDER RESULTS
========================================================= */

function renderResults(cards) {

  lastResults =
    cards || [];


  if (
    !lastResults.length
  ) {

    results.innerHTML =
      `
        <div class="empty-state">
          Nessun risultato.
        </div>
      `;

    return;

  }


  results.innerHTML =
    lastResults
      .map(
        card =>
          renderCard(card)
      )
      .join("");

}


/* =========================================================
   SEARCH BY NAME
========================================================= */

async function searchByName(
  query,
  page,
  append = false
) {

  status.textContent =
    `Ricerca ${query}...`;


  const params =
    new URLSearchParams();


  params.set(
    "name",
    query
  );


  params.set(
    "pagination:page",
    page
  );


  params.set(
    "pagination:itemsPerPage",
    PAGE_SIZE
  );


  const response =
    await fetch(
      `${API}/it/cards?${params.toString()}`
    );


  if (!response.ok) {

    throw new Error(
      "Errore ricerca nome"
    );

  }


  const data =
    await response.json();


  const italianCards =
    data.cards ||
    data ||
    [];


  if (
    currentLang === "it"
  ) {

    const finalCards =
      italianCards.map(
        card => ({
          ...card,
          displayLanguage: "it"
        })
      );


    if (append) {

      lastResults =
        lastResults.concat(
          finalCards
        );

    } else {

      lastResults =
        finalCards;

    }


    renderResults(
      lastResults
    );


    hasMore =
      italianCards.length ===
      PAGE_SIZE;


    loadMoreWrap.style.display =
      hasMore
        ? "block"
        : "none";


    status.textContent =
      `${lastResults.length} risultati`;

    return;

  }


  const languageCards =
    await Promise.all(

      italianCards.map(
        async italianCard => {

          const localizedCard =
            await getLanguageCard(
              italianCard.id,
              currentLang
            );


          if (
            localizedCard
          ) {

            return {
              ...localizedCard,

              name:
                italianCard.name,

              displayLanguage:
                currentLang
            };

          }


          return null;

        }
      )

    );


  const validCards =
    languageCards.filter(
      Boolean
    );


  if (append) {

    lastResults =
      lastResults.concat(
        validCards
      );

  } else {

    lastResults =
      validCards;

  }


  renderResults(
    lastResults
  );


  hasMore =
    italianCards.length ===
    PAGE_SIZE;


  loadMoreWrap.style.display =
    hasMore
      ? "block"
      : "none";


  if (
    currentLang === "ja" &&
    !validCards.length
  ) {

    status.textContent =
      `Nessuna versione giapponese trovata per "${query}".`;

  } else {

    status.textContent =
      `${lastResults.length} risultati`;

  }

}


/* =========================================================
   SEARCH BY NUMBER
========================================================= */

async function searchByNumber(
  number,
  page,
  append = false
) {

  status.textContent =
    `Ricerca carta numero ${number}...`;


  const params =
    new URLSearchParams();


  params.set(
    "localId",
    number
  );


  params.set(
    "pagination:page",
    page
  );


  params.set(
    "pagination:itemsPerPage",
    PAGE_SIZE
  );


  const response =
    await fetch(
      `${API}/${currentLang}/cards?${params.toString()}`
    );


  if (!response.ok) {

    throw new Error(
      "Errore ricerca numero"
    );

  }


  const data =
    await response.json();


  const cards =
    data.cards ||
    data ||
    [];


  const finalCards =
    await localizeResults(
      cards
    );


  if (append) {

    lastResults =
      lastResults.concat(
        finalCards
      );

  } else {

    lastResults =
      finalCards;

  }


  renderResults(
    lastResults
  );


  hasMore =
    cards.length ===
    PAGE_SIZE;


  loadMoreWrap.style.display =
    hasMore
      ? "block"
      : "none";


  status.textContent =
    `${lastResults.length} carte numerate ${number}`;

}


/* =========================================================
   SEARCH INSIDE SET
========================================================= */

async function searchInsideSet(
  query,
  setId
) {

  status.textContent =
    "Ricerca nel set...";


  loadMoreWrap.style.display =
    "none";


  const set =
    findSetById(
      setId
    );


  if (!set) {

    renderResults([]);

    status.textContent =
      "Set non trovato.";

    return;

  }


  try {

    const response =
      await fetch(
        `${API}/${currentLang}/sets/${encodeURIComponent(set.id)}`
      );


    if (!response.ok) {

      throw new Error(
        "Set non trovato"
      );

    }


    const fullSet =
      await response.json();


    let cards =
      fullSet.cards ||
      [];


    const wanted =
      normalize(
        query
      );


    if (wanted) {

      if (
        /^\d+$/.test(
          wanted
        )
      ) {

        cards =
          cards.filter(
            card =>
              String(
                card.localId
              ) ===
              String(
                wanted
              )
          );

      } else {

        const italianCards =
          await Promise.all(

            cards.map(
              card =>
                getItalianCard(
                  card.id
                )
            )

          );


        const matchingIds =
          new Set();


        italianCards.forEach(
          italianCard => {

            if (
              italianCard &&
              normalize(
                italianCard.name
              ).includes(
                wanted
              )
            ) {

              matchingIds.add(
                italianCard.id
              );

            }

          }
        );


        cards =
          cards.filter(
            card =>
              matchingIds.has(
                card.id
              )
          );

      }

    }


    const finalCards =
      await localizeResults(
        cards
      );


    lastResults =
      finalCards;


    renderResults(
      finalCards
    );


    if (
      currentLang === "ja" &&
      !finalCards.length
    ) {

      status.textContent =
        "Nessuna carta giapponese trovata nel set.";

    } else {

      status.textContent =
        `${finalCards.length} risultati in ${set.name}`;

    }

  } catch (error) {

    console.error(
      error
    );


    renderResults([]);


    status.textContent =
      "Errore nella ricerca del set.";

  }

}


/* =========================================================
   EXACT CARD ID
========================================================= */

async function searchExactCard(
  query
) {

  if (
    !query.includes("-") ||
    query.includes(" ")
  ) {

    return false;

  }


  try {

    const response =
      await fetch(
        `${API}/${currentLang}/cards/${encodeURIComponent(query)}`
      );


    if (!response.ok) {

      return false;

    }


    const card =
      await response.json();


    const finalCard =
      (
        await localizeResults(
          [card]
        )
      )[0];


    if (!finalCard) {

      return false;

    }


    renderResults([
      finalCard
    ]);


    status.textContent =
      "1 risultato";


    loadMoreWrap.style.display =
      "none";


    return true;

  } catch (error) {

    console.error(
      error
    );

    return false;

  }

}


/* =========================================================
   MAIN SEARCH
========================================================= */

async function searchCards() {

  if (loading) {
    return;
  }


  loading =
    true;


  currentQuery =
    searchInput.value.trim();


  currentSetId =
    setSelect.value;


  currentLang =
    languageSelect.value;


  currentPage =
    1;


  lastResults =
    [];


  loadMoreWrap.style.display =
    "none";


  results.innerHTML =
    "";


  const query =
    currentQuery;


  const setId =
    currentSetId;


  try {

    if (
      !query &&
      setId
    ) {

      await searchInsideSet(
        "",
        setId
      );

      return;

    }


    if (
      !query &&
      !setId
    ) {

      status.textContent =
        "Inserisci un nome o un numero.";

      renderResults([]);

      return;

    }


    if (
      query.includes("-") &&
      !query.includes(" ")
    ) {

      const found =
        await searchExactCard(
          query
        );


      if (found) {
        return;
      }

    }


    if (setId) {

      await searchInsideSet(
        query,
        setId
      );

      return;

    }


    if (
      /^\d+$/.test(
        query
      )
    ) {

      await searchByNumber(
        query,
        1,
        false
      );

      return;

    }


    await searchByName(
      query,
      1,
      false
    );

  } catch (error) {

    console.error(
      error
    );


    renderResults([]);


    status.textContent =
      "Errore durante la ricerca.";

  } finally {

    loading =
      false;

  }

}


/* =========================================================
   LOAD MORE
========================================================= */

async function loadMore() {

  if (
    loading ||
    !hasMore
  ) {
    return;
  }


  loading =
    true;


  try {

    currentPage++;


    const query =
      currentQuery;


    const setId =
      currentSetId;


    if (setId) {

      hasMore =
        false;

      loadMoreWrap.style.display =
        "none";

      return;

    }


    if (
      /^\d+$/.test(
        query
      )
    ) {

      await searchByNumber(
        query,
        currentPage,
        true
      );

      return;

    }


    await searchByName(
      query,
      currentPage,
      true
    );

  } catch (error) {

    console.error(
      error
    );


    currentPage--;


    status.textContent =
      "Errore nel caricamento.";

  } finally {

    loading =
      false;

  }

}


/* =========================================================
   EVENTS
========================================================= */

searchBtn.addEventListener(
  "click",
  searchCards
);


searchInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      searchCards();

    }

  }
);


languageSelect.addEventListener(
  "change",
  async () => {

    currentLang =
      languageSelect.value;


    currentSetId =
      "";


    setSelect.value =
      "";


    await loadSets(
      currentLang
    );


    if (
      searchInput.value.trim()
    ) {

      searchCards();

    }

  }
);


setSelect.addEventListener(
  "change",
  () => {

    if (
      searchInput.value.trim() ||
      setSelect.value
    ) {

      searchCards();

    }

  }
);


loadMoreBtn.addEventListener(
  "click",
  loadMore
);


/* =========================================================
   CARD CLICK
========================================================= */

results.addEventListener(
  "click",
  event => {

    const viewButton =
      event.target.closest(
        ".view-btn"
      );


    if (viewButton) {

      event.stopPropagation();


      viewCard(
        viewButton.dataset.cardId
      );


      return;

    }


    const wishButton =
      event.target.closest(
        ".wish-btn"
      );


    if (wishButton) {

      event.stopPropagation();


      const card =
        lastResults.find(
          item =>
            String(item.id) ===
            String(
              wishButton.dataset.cardId
            )
        );


      if (card) {

        addToWishlist(
          card
        );

      }


      return;

    }


    const addButton =
      event.target.closest(
        ".add-btn"
      );


    if (addButton) {

      event.stopPropagation();


      addToCollection(
        addButton.dataset.cardId
      );


      return;

    }


    const card =
      event.target.closest(
        ".catalog-card"
      );


    if (card) {

      viewCard(
        card.dataset.cardId
      );

    }

  }
);


/* =========================================================
   VIEW CARD
========================================================= */

async function viewCard(
  cardId
) {

  if (!cardId) {
    return;
  }


  try {

    const response =
      await fetch(
        `${API}/${currentLang}/cards/${encodeURIComponent(cardId)}`
      );


    if (!response.ok) {

      throw new Error(
        "Card non trovata"
      );

    }


    const card =
      await response.json();


    const italianCard =
      await getItalianCard(
        cardId
      );


    const displayName =
      italianCard?.name ||
      card.name ||
      "Card";


    const setName =
      getSetName(
        card
      );


    alert(

      `${displayName}\n\n` +

      `Set: ${setName}\n` +

      `Numero: ${
        card.localId ||
        "—"
      }\n` +

      `Lingua: ${
        languageName(
          currentLang
        )
      }\n\n` +

      `ID: ${
        card.id ||
        cardId
      }`

    );

  } catch (error) {

    console.error(
      error
    );


    alert(
      "Impossibile aprire la carta."
    );

  }

}


/* =========================================================
   ADD TO COLLECTION
========================================================= */

function addToCollection(
  cardId
) {

  if (!cardId) {
    return;
  }


  const url =
    `collection.html?add=${encodeURIComponent(cardId)}&lang=${encodeURIComponent(currentLang)}`;


  window.location.href =
    url;

}


/* =========================================================
   INIT
========================================================= */

(async function init() {

  currentLang =
    languageSelect.value;


  await loadSets(
    currentLang
  );

})();


/* =========================================================
   SERVICE WORKER
========================================================= */

if (
  "serviceWorker" in navigator &&
  location.protocol !== "file:"
) {

  navigator.serviceWorker
    .register(
      "./sw.js?v=13"
    )
    .catch(
      () => {}
    );

}
