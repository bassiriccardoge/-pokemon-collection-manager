<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Collection Manager – Catalogo V8</title>

  <link rel="stylesheet" href="./style.css">

  <style>
    .catalog-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .catalog-toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .catalog-toolbar input,
    .catalog-toolbar select,
    .catalog-toolbar button {
      min-height: 42px;
      border: 1px solid #334155;
      background: #111827;
      color: #fff;
      padding: 0 14px;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .catalog-toolbar input {
      flex: 1;
      min-width: 260px;
    }

    .catalog-toolbar button {
      cursor: pointer;
      font-weight: 700;
    }

    .catalog-toolbar button:hover {
      border-color: #60a5fa;
    }

    #status {
      margin: 10px 0 18px;
      color: #94a3b8;
      min-height: 20px;
    }

    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
    }

    .catalog-card {
      background: #111827;
      border: 1px solid #263449;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .catalog-card:hover {
      border-color: #60a5fa;
    }

    .catalog-card img {
      width: 100%;
      display: block;
      border-radius: 5px;
      background: #0b1220;
    }

    .catalog-card-name {
      margin-top: 9px;
      font-weight: 700;
      color: #f8fafc;
    }

    .catalog-card-meta {
      margin-top: 4px;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }

    .catalog-card-id {
      margin-top: 3px;
      font-size: 11px;
      color: #64748b;
    }

    #loadMoreWrap {
      display: none;
      justify-content: center;
      margin: 25px 0;
    }

    #loadMoreBtn {
      min-height: 42px;
      padding: 0 20px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #111827;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    #loadMoreBtn:hover {
      border-color: #60a5fa;
    }

    #loadMoreBtn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #detail {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #263449;
      border-radius: 8px;
      background: #0f172a;
    }

    #detailContent {
      display: grid;
      grid-template-columns: minmax(220px, 360px) 1fr;
      gap: 25px;
    }

    #detailContent img {
      width: 100%;
      max-width: 360px;
      border-radius: 8px;
    }

    .detail-info h2 {
      margin-top: 0;
    }

    .detail-row {
      margin: 8px 0;
      color: #cbd5e1;
    }

    .detail-row strong {
      color: #fff;
    }

    .detail-actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .detail-actions button {
      min-height: 42px;
      padding: 0 16px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #111827;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    .detail-actions button:hover {
      border-color: #60a5fa;
    }

    .notice {
      grid-column: 1 / -1;
      padding: 15px;
      border: 1px solid #334155;
      border-radius: 7px;
      background: #111827;
      color: #cbd5e1;
    }

    .candidate {
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #263449;
      border-radius: 6px;
      cursor: pointer;
      background: #0b1220;
    }

    .candidate:hover {
      border-color: #60a5fa;
    }

    @media (max-width: 700px) {
      #detailContent {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="catalog-page">

    <h1>Catalogo Pokémon</h1>

    <div class="catalog-toolbar">
      <input
        id="searchInput"
        type="text"
        placeholder="Es. Pikachu, 30th, Pikachu 30th, 154/220..."
        autocomplete="off"
      >

      <select id="langSelect">
        <option value="it">Italiano</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>

      <button id="searchBtn">CERCA</button>
    </div>

    <div id="status"></div>

    <div id="results"></div>

    <div id="loadMoreWrap">
      <button id="loadMoreBtn">LOAD MORE</button>
    </div>

    <section id="detail">
      <div id="detailContent"></div>
    </section>

  </main>

<script>
const API = 'https://api.tcgdex.net/v2/';
const PAGE_SIZE = 40;

const searchInput = document.getElementById('searchInput');
const langSelect = document.getElementById('langSelect');
const searchBtn = document.getElementById('searchBtn');
const resultsEl = document.getElementById('results');
const statusEl = document.getElementById('status');
const detailEl = document.getElementById('detail');
const detailContent = document.getElementById('detailContent');
const loadMoreWrap = document.getElementById('loadMoreWrap');
const loadMoreBtn = document.getElementById('loadMoreBtn');

let currentLang = 'it';
let currentQuery = '';
let currentPage = 1;
let loading = false;
let lastResults = [];
let hasMore = false;

let setsMap = {};
let setsLoaded = false;


/* =========================================================
   GENERALI
========================================================= */

function normalizeText(value) {
  return String(value || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .trim();
}


function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


function getSetIdFromCard(card) {
  if (!card || !card.id) return '';
  return String(card.id).split('-')[0];
}


function getSetName(card) {
  if (card?.set?.name) {
    return card.set.name;
  }

  const setId = getSetIdFromCard(card);

  if (setId && setsMap[setId]) {
    return setsMap[setId].name || setId;
  }

  return setId || 'Set sconosciuto';
}


function setStatus(text) {
  statusEl.textContent = text || '';
}


async function fetchJson(url) {
  const response = await fetch(url);

  if (!response.ok) {
    throw new Error(`HTTP ${response.status}`);
  }

  return await response.json();
}


/* =========================================================
   SET
========================================================= */

async function loadSets() {
  if (setsLoaded) return;

  setStatus('Caricamento catalogo set...');

  const data = await fetchJson(`${API}${currentLang}/sets`);

  setsMap = {};

  if (Array.isArray(data)) {
    data.forEach(set => {
      if (set && set.id) {
        setsMap[set.id] = set;
      }
    });
  }

  setsLoaded = true;
}


function findSet(query) {
  const q = normalizeText(query);

  if (!q) return null;

  const entries = Object.values(setsMap);

  /* 1. ID esatto */
  let found = entries.find(set =>
    normalizeText(set.id) === q
  );

  if (found) return found;

  /* 2. Nome esatto */
  found = entries.find(set =>
    normalizeText(set.name) === q
  );

  if (found) return found;

  /* 3. ID contenuto */
  found = entries.find(set =>
    normalizeText(set.id).includes(q)
  );

  if (found) return found;

  /* 4. Nome contenuto */
  found = entries.find(set =>
    normalizeText(set.name).includes(q)
  );

  if (found) return found;

  return null;
}


/*
  Cerca un set usando una parola.
  Serve soprattutto per query tipo:

  Pikachu 30th
  Charizard Base
  Mew 151
*/
function findSetFromTokens(tokens) {

  for (const token of tokens) {
    const found = findSet(token);

    if (found) {
      return {
        set: found,
        token
      };
    }
  }

  /*
    Prova anche combinazioni di due parole.
    Utile per nomi di set composti.
  */
  for (let i = 0; i < tokens.length; i++) {
    for (let j = i + 1; j < tokens.length; j++) {

      const combined = `${tokens[i]} ${tokens[j]}`;

      const found = findSet(combined);

      if (found) {
        return {
          set: found,
          token: combined
        };
      }
    }
  }

  return null;
}


/* =========================================================
   SET COMPLETO
========================================================= */

async function loadFullSet(setId) {
  return await fetchJson(
    `${API}${currentLang}/sets/${encodeURIComponent(setId)}`
  );
}


function getSetCards(setData) {
  if (!setData) return [];

  if (Array.isArray(setData.cards)) {
    return setData.cards;
  }

  return [];
}


/* =========================================================
   CARD ESATTA
========================================================= */

async function loadExactCard(setId, localId) {
  return await fetchJson(
    `${API}${currentLang}/sets/${encodeURIComponent(setId)}/${encodeURIComponent(localId)}`
  );
}


/* =========================================================
   FRAZIONE 154/220
========================================================= */

function parseFractionQuery(query) {

  const match = query.match(
    /^([0-9]+[A-Za-z]?)\s*\/\s*([0-9]+)$/
  );

  if (!match) return null;

  return {
    localId: match[1],
    denominator: Number(match[2])
  };
}


async function searchByFraction(query) {

  const parsed = parseFractionQuery(query);

  if (!parsed) return false;

  const candidates = [];

  const sets = Object.values(setsMap);

  /*
    Il denominatore può corrispondere al cardCount.official
    oppure al cardCount.total.

    Non assumiamo che il denominatore identifichi
    automaticamente un unico set.
  */
  for (const set of sets) {

    const official = Number(set?.cardCount?.official || 0);
    const total = Number(set?.cardCount?.total || 0);

    if (
      official !== parsed.denominator &&
      total !== parsed.denominator
    ) {
      continue;
    }

    try {

      const fullSet = await loadFullSet(set.id);
      const cards = getSetCards(fullSet);

      const matchingCard = cards.find(card =>
        String(card.localId) === String(parsed.localId)
      );

      if (matchingCard) {
        candidates.push({
          set,
          card: matchingCard
        });
      }

    } catch (error) {
      console.warn(
        'Errore caricando set',
        set.id,
        error
      );
    }
  }

  /*
    Nessuna corrispondenza.
  */
  if (candidates.length === 0) {

    resultsEl.innerHTML = `
      <div class="notice">
        Nessuna carta trovata per
        <strong>${escapeHtml(query)}</strong>.
      </div>
    `;

    setStatus('0 risultati');
    loadMoreWrap.style.display = 'none';

    return true;
  }


  /*
    Una sola corrispondenza:
    mostriamo direttamente la carta.
  */
  if (candidates.length === 1) {

    const item = candidates[0];

    lastResults = [item.card];

    renderResults(lastResults);

    setStatus(
      `1 risultato · ${item.set.name || item.set.id}`
    );

    loadMoreWrap.style.display = 'none';

    return true;
  }


  /*
    Più set compatibili:
    NON scegliamo arbitrariamente.
  */
  resultsEl.innerHTML = `
    <div class="notice">
      <strong>${escapeHtml(query)}</strong>
      corrisponde a più set possibili.
      Seleziona quello corretto:
    </div>
  `;

  candidates.forEach(item => {

    const card = item.card;
    const set = item.set;

    const div = document.createElement('div');

    div.className = 'candidate';

    div.innerHTML = `
      <strong>${escapeHtml(card.name || 'Carta')}</strong>
      <br>
      <span>
        ${escapeHtml(set.name || set.id)}
      </span>
      <br>
      <small>
        ${escapeHtml(card.localId || '')}
        /
        ${escapeHtml(
          set?.cardCount?.official ||
          set?.cardCount?.total ||
          parsed.denominator
        )}
      </small>
    `;

    div.addEventListener('click', () => {
      showCard(card);
    });

    resultsEl.appendChild(div);
  });

  setStatus(
    `${candidates.length} possibili corrispondenze`
  );

  loadMoreWrap.style.display = 'none';

  return true;
}


/* =========================================================
   ID COMPLETO 30th-018
========================================================= */

function parseFullCardId(query) {

  const match = query.match(
    /^([A-Za-z0-9]+)-([0-9]+[A-Za-z]?)$/
  );

  if (!match) return null;

  return {
    setId: match[1],
    localId: match[2]
  };
}


async function searchByFullCardId(query) {

  const parsed = parseFullCardId(query);

  if (!parsed) return false;

  try {

    const card = await loadExactCard(
      parsed.setId,
      parsed.localId
    );

    lastResults = [card];

    renderResults(lastResults);

    setStatus('1 risultato');

    loadMoreWrap.style.display = 'none';

  } catch (error) {

    resultsEl.innerHTML = `
      <div class="notice">
        Carta non trovata:
        <strong>${escapeHtml(query)}</strong>
      </div>
    `;

    setStatus('0 risultati');
    loadMoreWrap.style.display = 'none';
  }

  return true;
}


/* =========================================================
   SET + NOME
========================================================= */

async function searchInsideSet(query, setInfo) {

  const set = setInfo.set;
  const setData = await loadFullSet(set.id);
  const cards = getSetCards(setData);

  const tokens = query
    .split(/\s+/)
    .map(token => normalizeText(token))
    .filter(Boolean);

  /*
    Togliamo dal testo il token che ha identificato il set.
  */
  const setToken = normalizeText(setInfo.token);

  let remainingTokens = tokens.filter(token => {
    return !setToken.split(/\s+/).includes(token);
  });

  /*
    Se il nome del set è composto, facciamo anche una seconda
    verifica eliminando tutte le parole che compaiono nel set.
  */
  const setWords = normalizeText(
    `${set.id} ${set.name || ''}`
  )
    .split(/\s+/)
    .filter(Boolean);

  remainingTokens = remainingTokens.filter(token =>
    !setWords.includes(token)
  );

  /*
    Se non resta alcun testo:
    richiesta = solo set.
  */
  if (remainingTokens.length === 0) {

    lastResults = cards;

    renderResults(lastResults);

    setStatus(
      `${cards.length} carte · ${set.name || set.id}`
    );

    loadMoreWrap.style.display = 'none';

    return true;
  }


  /*
    Ricerca nome carta dentro il set.
  */
  const filtered = cards.filter(card => {

    const cardName = normalizeText(card.name);

    return remainingTokens.every(token =>
      cardName.includes(token)
    );
  });


  lastResults = filtered;

  renderResults(filtered);

  setStatus(
    `${filtered.length} risultati · ${set.name || set.id}`
  );

  loadMoreWrap.style.display = 'none';

  return true;
}


/* =========================================================
   RICERCA GENERALE
========================================================= */

function buildGeneralSearchUrl(page) {

  const params = new URLSearchParams();

  params.set(
    'name',
    currentQuery
  );

  params.set(
    'pagination:page',
    page
  );

  params.set(
    'pagination:itemsPerPage',
    PAGE_SIZE
  );

  return `${API}${currentLang}/cards?${params.toString()}`;
}


async function loadGeneralPage(page, append) {

  const url = buildGeneralSearchUrl(page);

  const data = await fetchJson(url);

  const pageResults = Array.isArray(data) ? data : [];

  if (append) {
    lastResults = [
      ...lastResults,
      ...pageResults
    ];
  } else {
    lastResults = pageResults;
  }

  currentPage = page;

  hasMore = pageResults.length === PAGE_SIZE;

  renderResults(lastResults);

  setStatus(
    `${lastResults.length} risultati`
  );

  loadMoreWrap.style.display =
    hasMore ? 'flex' : 'none';
}


/* =========================================================
   RENDER
========================================================= */

function renderResults(cards) {

  resultsEl.innerHTML = '';

  if (!cards || cards.length === 0) {

    resultsEl.innerHTML = `
      <div class="notice">
        Nessun risultato.
      </div>
    `;

    return;
  }


  cards.forEach(card => {

    const div = document.createElement('div');

    div.className = 'catalog-card';

    const image =
      card.image
        ? `${card.image}/high.webp`
        : '';

    div.innerHTML = `
      ${
        image
          ? `<img src="${escapeHtml(image)}" alt="${escapeHtml(card.name || '')}" loading="lazy">`
          : ''
      }

      <div class="catalog-card-name">
        ${escapeHtml(card.name || 'Carta')}
      </div>

      <div class="catalog-card-meta">
        ${escapeHtml(getSetName(card))}
      </div>

      <div class="catalog-card-id">
        ${escapeHtml(card.localId || '')}
      </div>
    `;

    div.addEventListener('click', () => {
      showCard(card);
    });

    resultsEl.appendChild(div);
  });
}


/* =========================================================
   DETTAGLIO
========================================================= */

async function showCard(card) {

  detailEl.style.display = 'block';

  detailContent.innerHTML = `
    <div class="notice">
      Caricamento carta...
    </div>
  `;

  try {

    let fullCard = card;

    /*
      Se abbiamo ID completo, recuperiamo il dettaglio.
    */
    const setId = getSetIdFromCard(card);
    const localId = card.localId;

    if (setId && localId) {

      try {
        fullCard = await loadExactCard(
          setId,
          localId
        );
      } catch (error) {
        console.warn(
          'Impossibile caricare dettaglio completo',
          error
        );
      }
    }


    const image =
      fullCard.image
        ? `${fullCard.image}/high.webp`
        : '';


    const setName =
      fullCard?.set?.name ||
      getSetName(fullCard);


    detailContent.innerHTML = `
      <div>
        ${
          image
            ? `<img src="${escapeHtml(image)}" alt="${escapeHtml(fullCard.name || '')}">`
            : ''
        }
      </div>

      <div class="detail-info">

        <h2>
          ${escapeHtml(fullCard.name || 'Carta')}
        </h2>

        <div class="detail-row">
          <strong>Set:</strong>
          ${escapeHtml(setName)}
        </div>

        <div class="detail-row">
          <strong>Numero:</strong>
          ${escapeHtml(fullCard.localId || '')}
        </div>

        <div class="detail-row">
          <strong>ID:</strong>
          ${escapeHtml(fullCard.id || '')}
        </div>

        ${
          fullCard.rarity
            ? `
              <div class="detail-row">
                <strong>Rarità:</strong>
                ${escapeHtml(fullCard.rarity)}
              </div>
            `
            : ''
        }

        ${
          fullCard.category
            ? `
              <div class="detail-row">
                <strong>Categoria:</strong>
                ${escapeHtml(fullCard.category)}
              </div>
            `
            : ''
        }

        <div class="detail-actions">

          <button id="saveCollectionBtn">
            AGGIUNGI ALLA COLLEZIONE
          </button>

          <button id="closeDetailBtn">
            CHIUDI
          </button>

        </div>

      </div>
    `;


    document
      .getElementById('closeDetailBtn')
      .addEventListener('click', () => {
        detailEl.style.display = 'none';
      });


    document
      .getElementById('saveCollectionBtn')
      .addEventListener('click', () => {
        saveCard(fullCard);
      });


    detailEl.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });

  } catch (error) {

    detailContent.innerHTML = `
      <div class="notice">
        Errore nel caricamento della carta.
      </div>
    `;
  }
}


/* =========================================================
   SALVATAGGIO COLLEZIONE
========================================================= */

function saveCard(card) {

  const collection =
    JSON.parse(
      localStorage.getItem('pcm_collection') || '[]'
    );

  const existing =
    collection.find(item =>
      item.catalogId === card.id
    );


  if (existing) {

    existing.quantity =
      Number(existing.quantity || 1) + 1;

  } else {

    collection.push({

      id:
        'card-' +
        Date.now().toString(36) +
        Math.random().toString(36).slice(2, 7),

      catalogId:
        card.id || '',

      name:
        card.name || '',

      localId:
        card.localId || '',

      set:
        getSetIdFromCard(card),

      setName:
        getSetName(card),

      language:
        currentLang,

      condition:
        'NM',

      quantity:
        1,

      grading:
        'Raw',

      grade:
        '',

      purchasePrice:
        '0',

      purchaseDate:
        new Date().toISOString().slice(0, 10),

      seller:
        '',

      notes:
        '',

      savedAt:
        new Date().toISOString()
    });
  }


  localStorage.setItem(
    'pcm_collection',
    JSON.stringify(collection)
  );


  alert(
    `${card.name || 'Carta'} aggiunta alla collezione.`
  );
}


/* =========================================================
   RICERCA PRINCIPALE
========================================================= */

async function searchCards() {

  if (loading) return;

  const query =
    searchInput.value.trim();

  if (!query) {
    setStatus('Inserisci una ricerca.');
    return;
  }


  loading = true;

  currentLang = langSelect.value;
  currentQuery = query;
  currentPage = 1;

  lastResults = [];
  hasMore = false;

  resultsEl.innerHTML = '';

  detailEl.style.display = 'none';

  loadMoreWrap.style.display = 'none';

  searchBtn.disabled = true;


  /*
    Quando cambia lingua, ricarichiamo i set.
  */
  setsLoaded = false;
  setsMap = {};


  try {

    await loadSets();


    /*
      1. 154/220
    */
    if (parseFractionQuery(query)) {

      await searchByFraction(query);

      return;
    }


    /*
      2. 30th-018
    */
    if (parseFullCardId(query)) {

      await searchByFullCardId(query);

      return;
    }


    /*
      Tokenizzazione.
    */
    const tokens =
      query
        .split(/\s+/)
        .map(token => token.trim())
        .filter(Boolean);


    /*
      3. Cerca un set nella query.
      Esempio:
      Pikachu 30th
    */
    const setInfo =
      findSetFromTokens(tokens);


    if (setInfo) {

      await searchInsideSet(
        query,
        setInfo
      );

      return;
    }


    /*
      4. Ricerca generale.
      Esempio:
      Pikachu
    */
    await loadGeneralPage(
      1,
      false
    );

  } catch (error) {

    console.error(error);

    resultsEl.innerHTML = `
      <div class="notice">
        Errore durante la ricerca.
        Controlla la connessione e riprova.
      </div>
    `;

    setStatus('Errore');

  } finally {

    loading = false;
    searchBtn.disabled = false;
  }
}


/* =========================================================
   LOAD MORE
========================================================= */

async function loadMore() {

  if (loading || !hasMore) return;

  loading = true;

  loadMoreBtn.disabled = true;

  loadMoreBtn.textContent = 'CARICAMENTO...';


  try {

    await loadGeneralPage(
      currentPage + 1,
      true
    );

  } catch (error) {

    console.error(error);

    setStatus(
      'Errore nel caricamento di altre carte.'
    );

  } finally {

    loading = false;

    loadMoreBtn.disabled = false;

    loadMoreBtn.textContent = 'LOAD MORE';
  }
}


/* =========================================================
   EVENTI
========================================================= */

searchBtn.addEventListener(
  'click',
  searchCards
);


searchInput.addEventListener(
  'keydown',
  event => {

    if (event.key === 'Enter') {
      searchCards();
    }

  }
);


loadMoreBtn.addEventListener(
  'click',
  loadMore
);


langSelect.addEventListener(
  'change',
  () => {

    setsLoaded = false;
    setsMap = {};

  }
);


/* =========================================================
   SERVICE WORKER
========================================================= */

if ('serviceWorker' in navigator) {

  window.addEventListener(
    'load',
    () => {

      navigator.serviceWorker
        .register('./sw.js?v=8')
        .catch(error => {
          console.warn(
            'Service worker error:',
            error
          );
        });

    }
  );

}
</script>

</body>
</html>
