<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pokémon Collection Manager – Catalogo V7</title>

  <link rel="stylesheet" href="./style.css">

  <style>
    .catalog-page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .catalog-toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .catalog-toolbar input,
    .catalog-toolbar select,
    .catalog-toolbar button {
      min-height: 42px;
      border: 1px solid #334155;
      background: #111827;
      color: #fff;
      padding: 0 14px;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .catalog-toolbar input {
      flex: 1;
      min-width: 260px;
    }

    .catalog-toolbar button {
      cursor: pointer;
      font-weight: 700;
    }

    .catalog-toolbar button:hover {
      border-color: #60a5fa;
    }

    #status {
      margin: 10px 0 18px;
      color: #94a3b8;
      min-height: 20px;
    }

    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
    }

    .catalog-card {
      background: #111827;
      border: 1px solid #263449;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
    }

    .catalog-card:hover {
      border-color: #60a5fa;
    }

    .catalog-card img {
      width: 100%;
      display: block;
      border-radius: 5px;
      background: #0b1220;
    }

    .catalog-card-name {
      margin-top: 9px;
      font-weight: 700;
      color: #f8fafc;
    }

    .catalog-card-meta {
      margin-top: 4px;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }

    .catalog-card-id {
      margin-top: 3px;
      font-size: 11px;
      color: #64748b;
    }

    #loadMoreWrap {
      display: none;
      justify-content: center;
      margin: 25px 0;
    }

    #loadMoreBtn {
      min-height: 42px;
      padding: 0 20px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #111827;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    #loadMoreBtn:hover {
      border-color: #60a5fa;
    }

    #loadMoreBtn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #detail {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #263449;
      border-radius: 8px;
      background: #0f172a;
    }

    #detailContent {
      display: grid;
      grid-template-columns: minmax(220px, 360px) 1fr;
      gap: 25px;
    }

    #detailContent img {
      width: 100%;
      max-width: 360px;
      border-radius: 8px;
    }

    .detail-info h2 {
      margin-top: 0;
    }

    .detail-row {
      margin: 8px 0;
      color: #cbd5e1;
    }

    .detail-row strong {
      color: #fff;
    }

    .detail-actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .detail-actions button {
      min-height: 42px;
      padding: 0 16px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #111827;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    .detail-actions button:hover {
      border-color: #60a5fa;
    }

    .notice {
      grid-column: 1 / -1;
      padding: 15px;
      border: 1px solid #334155;
      border-radius: 7px;
      background: #111827;
      color: #cbd5e1;
    }

    .candidate {
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #263449;
      border-radius: 6px;
      cursor: pointer;
      background: #0b1220;
    }

    .candidate:hover {
      border-color: #60a5fa;
    }

    @media (max-width: 700px) {
      #detailContent {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<main class="catalog-page">

  <h1>Catalogo Pokémon</h1>

  <div class="catalog-toolbar">

    <input
      id="searchInput"
      type="text"
      placeholder="Cerca Pokémon, set o codice..."
      autocomplete="off"
    >

    <select id="langSelect">
      <option value="it">Italiano</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>

    <button id="searchBtn">
      CERCA
    </button>

  </div>

  <div id="status"></div>

  <div id="results"></div>

  <div id="loadMoreWrap">
    <button id="loadMoreBtn">
      LOAD MORE
    </button>
  </div>

  <section id="detail">

    <div id="detailContent"></div>

  </section>

</main>

<script>

const API = 'https://api.tcgdex.net/v2/';
const PAGE_SIZE = 40;

const searchInput = document.getElementById('searchInput');
const langSelect = document.getElementById('langSelect');
const searchBtn = document.getElementById('searchBtn');

const resultsEl = document.getElementById('results');
const statusEl = document.getElementById('status');

const detailEl = document.getElementById('detail');
const detailContent = document.getElementById('detailContent');

const loadMoreWrap = document.getElementById('loadMoreWrap');
const loadMoreBtn = document.getElementById('loadMoreBtn');

let currentLang = 'it';
let currentQuery = '';

let currentPage = 1;

let loading = false;

let lastResults = [];

let hasMore = false;

let setsMap = {};
let setsLoaded = false;


/* =========================================================
   UTILITY
========================================================= */

function normalizeText(value) {

  return String(value || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .trim();

}


function escapeHtml(value) {

  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function getSetIdFromCard(card) {

  if (!card || !card.id) {
    return '';
  }

  return String(card.id).split('-')[0];

}


function getSetName(card) {

  if (card?.set?.name) {
    return card.set.name;
  }

  const setId = getSetIdFromCard(card);

  if (setId && setsMap[setId]) {
    return setsMap[setId].name || setId;
  }

  return setId || 'Set sconosciuto';

}


async function fetchJson(url) {

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error(`HTTP ${response.status}`);
  }

  return await response.json();

}


/* =========================================================
   SET
========================================================= */

async function loadSets() {

  if (setsLoaded) {
    return;
  }

  const data =
    await fetchJson(
      `${API}${currentLang}/sets`
    );

  setsMap = {};

  if (Array.isArray(data)) {

    data.forEach(set => {

      if (set && set.id) {

        setsMap[set.id] = set;

      }

    });

  }

  setsLoaded = true;

}


function findSet(query) {

  const q = normalizeText(query);

  if (!q) {
    return null;
  }

  const entries =
    Object.values(setsMap);


  /*
    ID esatto
  */

  let found =
    entries.find(set =>
      normalizeText(set.id) === q
    );

  if (found) {
    return found;
  }


  /*
    Nome esatto
  */

  found =
    entries.find(set =>
      normalizeText(set.name) === q
    );

  if (found) {
    return found;
  }


  /*
    ID parziale
  */

  found =
    entries.find(set =>
      normalizeText(set.id).includes(q)
    );

  if (found) {
    return found;
  }


  /*
    Nome parziale
  */

  found =
    entries.find(set =>
      normalizeText(set.name).includes(q)
    );

  if (found) {
    return found;
  }


  return null;

}


/* =========================================================
   SET COMPLETO
========================================================= */

async function loadFullSet(setId) {

  return await fetchJson(
    `${API}${currentLang}/sets/${encodeURIComponent(setId)}`
  );

}


function getSetCards(setData) {

  if (!setData) {
    return [];
  }

  if (Array.isArray(setData.cards)) {
    return setData.cards;
  }

  return [];

}


/* =========================================================
   CARD ESATTA
========================================================= */

async function loadExactCard(setId, localId) {

  return await fetchJson(
    `${API}${currentLang}/sets/${encodeURIComponent(setId)}/${encodeURIComponent(localId)}`
  );

}


/* =========================================================
   RICERCA SET + NOME
========================================================= */

async function searchInsideSet(query, set) {

  const setData =
    await loadFullSet(set.id);

  const cards =
    getSetCards(setData);


  const normalizedQuery =
    normalizeText(query);


  const setId =
    normalizeText(set.id);

  const setName =
    normalizeText(set.name);


  /*
    Rimuoviamo dall'input il nome/id del set.
  */

  let cardQuery =
    normalizedQuery
      .replace(setId, '')
      .replace(setName, '')
      .trim();


  /*
    Se non rimane nulla,
    mostriamo tutto il set.
  */

  if (!cardQuery) {

    lastResults = cards;

    renderResults(cards);

    setStatus(
      `${cards.length} carte · ${set.name || set.id}`
    );

    loadMoreWrap.style.display = 'none';

    return true;

  }


  /*
    Cerca il nome dentro il set.
  */

  const filtered =
    cards.filter(card => {

      const name =
        normalizeText(card.name);

      return name.includes(cardQuery);

    });


  lastResults = filtered;

  renderResults(filtered);

  setStatus(
    `${filtered.length} risultati · ${set.name || set.id}`
  );

  loadMoreWrap.style.display = 'none';

  return true;

}


/* =========================================================
   URL RICERCA GENERALE
========================================================= */

function buildGeneralSearchUrl(page) {

  const params =
    new URLSearchParams();

  params.set(
    'name',
    currentQuery
  );

  params.set(
    'pagination:page',
    page
  );

  params.set(
    'pagination:itemsPerPage',
    PAGE_SIZE
  );

  return `${API}${currentLang}/cards?${params.toString()}`;

}


/* =========================================================
   RICERCA GENERALE
========================================================= */

async function loadGeneralPage(
  page,
  append
) {

  const url =
    buildGeneralSearchUrl(page);

  const data =
    await fetchJson(url);

  const pageResults =
    Array.isArray(data)
      ? data
      : [];


  if (append) {

    lastResults = [
      ...lastResults,
      ...pageResults
    ];

  } else {

    lastResults = pageResults;

  }


  currentPage = page;

  hasMore =
    pageResults.length === PAGE_SIZE;


  renderResults(lastResults);

  setStatus(
    `${lastResults.length} risultati`
  );


  loadMoreWrap.style.display =
    hasMore
      ? 'flex'
      : 'none';

}


/* =========================================================
   RENDER
========================================================= */

function renderResults(cards) {

  resultsEl.innerHTML = '';


  if (!cards || cards.length === 0) {

    resultsEl.innerHTML = `
      <div class="notice">
        Nessun risultato.
      </div>
    `;

    return;

  }


  cards.forEach(card => {

    const div =
      document.createElement('div');

    div.className =
      'catalog-card';


    const image =
      card.image
        ? `${card.image}/high.webp`
        : '';


    div.innerHTML = `

      ${
        image
          ? `
            <img
              src="${escapeHtml(image)}"
              alt="${escapeHtml(card.name || '')}"
              loading="lazy"
            >
          `
          : ''
      }

      <div class="catalog-card-name">
        ${escapeHtml(card.name || 'Carta')}
      </div>

      <div class="catalog-card-meta">
        ${escapeHtml(getSetName(card))}
      </div>

      <div class="catalog-card-id">
        ${escapeHtml(card.localId || '')}
      </div>

    `;


    div.addEventListener(
      'click',
      () => showCard(card)
    );


    resultsEl.appendChild(div);

  });

}


/* =========================================================
   DETTAGLIO
========================================================= */

async function showCard(card) {

  detailEl.style.display =
    'block';


  detailContent.innerHTML = `
    <div class="notice">
      Caricamento carta...
    </div>
  `;


  try {

    let fullCard = card;


    const setId =
      getSetIdFromCard(card);

    const localId =
      card.localId;


    if (setId && localId) {

      try {

        fullCard =
          await loadExactCard(
            setId,
            localId
          );

      } catch (error) {

        console.warn(
          'Dettaglio completo non disponibile',
          error
        );

      }

    }


    const image =
      fullCard.image
        ? `${fullCard.image}/high.webp`
        : '';


    const setName =
      fullCard?.set?.name ||
      getSetName(fullCard);


    detailContent.innerHTML = `

      <div>

        ${
          image
            ? `
              <img
                src="${escapeHtml(image)}"
                alt="${escapeHtml(fullCard.name || '')}"
              >
            `
            : ''
        }

      </div>


      <div class="detail-info">

        <h2>
          ${escapeHtml(fullCard.name || 'Carta')}
        </h2>


        <div class="detail-row">
          <strong>Set:</strong>
          ${escapeHtml(setName)}
        </div>


        <div class="detail-row">
          <strong>Numero:</strong>
          ${escapeHtml(fullCard.localId || '')}
        </div>


        <div class="detail-row">
          <strong>ID:</strong>
          ${escapeHtml(fullCard.id || '')}
        </div>


        ${
          fullCard.rarity
            ? `
              <div class="detail-row">
                <strong>Rarità:</strong>
                ${escapeHtml(fullCard.rarity)}
              </div>
            `
            : ''
        }


        <div class="detail-actions">

          <button id="saveCollectionBtn">
            AGGIUNGI ALLA COLLEZIONE
          </button>

          <button id="closeDetailBtn">
            CHIUDI
          </button>

        </div>

      </div>

    `;


    document
      .getElementById('closeDetailBtn')
      .addEventListener(
        'click',
        () => {
          detailEl.style.display = 'none';
        }
      );


    document
      .getElementById('saveCollectionBtn')
      .addEventListener(
        'click',
        () => {
          saveCard(fullCard);
        }
      );


    detailEl.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });


  } catch (error) {

    detailContent.innerHTML = `
      <div class="notice">
        Errore nel caricamento della carta.
      </div>
    `;

  }

}


/* =========================================================
   SALVATAGGIO
========================================================= */

function saveCard(card) {

  const collection =
    JSON.parse(
      localStorage.getItem(
        'pcm_collection'
      ) || '[]'
    );


  const existing =
    collection.find(item =>
      item.catalogId === card.id
    );


  if (existing) {

    existing.quantity =
      Number(existing.quantity || 1) + 1;

  } else {

    collection.push({

      id:
        'card-' +
        Date.now().toString(36) +
        Math.random()
          .toString(36)
          .slice(2, 7),

      catalogId:
        card.id || '',

      name:
        card.name || '',

      localId:
        card.localId || '',

      set:
        getSetIdFromCard(card),

      setName:
        getSetName(card),

      language:
        currentLang,

      condition:
        'NM',

      quantity:
        1,

      grading:
        'Raw',

      grade:
        '',

      purchasePrice:
        '0',

      purchaseDate:
        new Date()
          .toISOString()
          .slice(0, 10),

      seller:
        '',

      notes:
        '',

      savedAt:
        new Date().toISOString()

    });

  }


  localStorage.setItem(
    'pcm_collection',
    JSON.stringify(collection)
  );


  alert(
    `${card.name || 'Carta'} aggiunta alla collezione.`
  );

}


/* =========================================================
   RICERCA PRINCIPALE
========================================================= */

async function searchCards() {

  if (loading) {
    return;
  }


  const query =
    searchInput.value.trim();


  if (!query) {

    setStatus(
      'Inserisci una ricerca.'
    );

    return;

  }


  loading = true;

  searchBtn.disabled = true;


  currentLang =
    langSelect.value;

  currentQuery =
    query;

  currentPage =
    1;

  lastResults = [];

  hasMore =
    false;


  resultsEl.innerHTML =
    '';

  detailEl.style.display =
    'none';

  loadMoreWrap.style.display =
    'none';


  setsLoaded =
    false;

  setsMap =
    {};


  try {

    /*
      Carica tutti i set.
    */

    await loadSets();


    /*
      ======================================================
      CODICE TIPO 30th-018
      ======================================================
    */

    const fullIdMatch =
      query.match(
        /^([A-Za-z0-9]+)-([0-9]+[A-Za-z]?)$/
      );


    if (fullIdMatch) {

      const setId =
        fullIdMatch[1];

      const localId =
        fullIdMatch[2];


      /*
        Nel V7, se viene riconosciuto un set,
        carichiamo il set completo.
      */

      const set =
        findSet(setId);


      if (set) {

        await searchInsideSet(
          query,
          set
        );

        return;

      }

    }


    /*
      ======================================================
      SET
      ======================================================
    */

    const set =
      findSet(query);


    if (set) {

      await searchInsideSet(
        query,
        set
      );

      return;

    }


    /*
      ======================================================
      NUMERO TIPO 154/220
      ======================================================
    */

    const fractionMatch =
      query.match(
        /^([0-9]+[A-Za-z]?)\s*\/\s*([0-9]+)$/
      );


    if (fractionMatch) {

      /*
        Il V7 cerca il localId.
      */

      currentQuery =
        fractionMatch[1];

      await loadGeneralPage(
        1,
        false
      );

      return;

    }


    /*
      ======================================================
      RICERCA COMBINATA
      ESEMPIO:
      Pikachu 30th
      ======================================================
    */

    const tokens =
      query
        .split(/\s+/)
        .filter(Boolean);


    for (const token of tokens) {

      const tokenSet =
        findSet(token);


      if (tokenSet) {

        await searchInsideSet(
          query,
          tokenSet
        );

        return;

      }

    }


    /*
      ======================================================
      RICERCA NORMALE
      ======================================================
    */

    await loadGeneralPage(
      1,
      false
    );


  } catch (error) {

    console.error(error);


    resultsEl.innerHTML = `
      <div class="notice">
        Errore durante la ricerca.
        Controlla la connessione e riprova.
      </div>
    `;


    setStatus(
      'Errore'
    );


  } finally {

    loading = false;

    searchBtn.disabled =
      false;

  }

}


/* =========================================================
   LOAD MORE
========================================================= */

async function loadMore() {

  if (
    loading ||
    !hasMore
  ) {
    return;
  }


  loading = true;

  loadMoreBtn.disabled =
    true;

  loadMoreBtn.textContent =
    'CARICAMENTO...';


  try {

    await loadGeneralPage(
      currentPage + 1,
      true
    );


  } catch (error) {

    console.error(error);


    setStatus(
      'Errore nel caricamento.'
    );


  } finally {

    loading = false;

    loadMoreBtn.disabled =
      false;

    loadMoreBtn.textContent =
      'LOAD MORE';

  }

}


/* =========================================================
   EVENTI
========================================================= */

searchBtn.addEventListener(
  'click',
  searchCards
);


searchInput.addEventListener(
  'keydown',
  event => {

    if (event.key === 'Enter') {
      searchCards();
    }

  }
);


loadMoreBtn.addEventListener(
  'click',
  loadMore
);


langSelect.addEventListener(
  'change',
  () => {

    setsLoaded =
      false;

    setsMap =
      {};

  }
);


/* =========================================================
   SERVICE WORKER
========================================================= */

if ('serviceWorker' in navigator) {

  window.addEventListener(
    'load',
    () => {

      navigator.serviceWorker
        .register(
          './sw.js?v=7'
        )
        .catch(error => {

          console.warn(
            'Service worker error:',
            error
          );

        });

    }
  );

}

</script>

</body>
</html>
