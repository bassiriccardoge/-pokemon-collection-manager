  <style>
    .catalog-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 180px 260px auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }

    .catalog-toolbar input,
    .catalog-toolbar select {
      width: 100%;
      box-sizing: border-box;
    }

    .catalog-status {
      margin: 10px 0 18px;
      font-size: 13px;
      opacity: .8;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .catalog-card {
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.025);
      padding: 10px;
    }

    .catalog-card-image {
      width: 100%;
      aspect-ratio: 0.72;
      object-fit: contain;
      display: block;
      background: #080d16;
      margin-bottom: 10px;
    }

    .catalog-card-name {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .catalog-card-meta {
      font-size: 12px;
      opacity: .75;
      line-height: 1.5;
      min-height: 38px;
    }

    .catalog-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 10px;
    }

    .catalog-actions .btn {
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      padding: 7px 5px;
      font-size: 11px;
    }

    .catalog-actions .view-btn {
      grid-column: 1 / -1;
    }

    .load-more-wrap {
      display: flex;
      justify-content: center;
      margin: 22px 0;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 30px;
      text-align: center;
      opacity: .7;
    }

    @media (max-width: 1000px) {
      .catalog-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .catalog-toolbar {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 700px) {
      .catalog-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .catalog-toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style>

</head>

<script>

const API = "https://api.tcgdex.net/v2";

const PAGE_SIZE = 40;

const WISHLIST_KEY = "pcm_wishlist";

let currentLang = "it";
let currentPage = 1;
let currentQuery = "";
let currentSetId = "";

let allSets = [];
let setsMap = {};

let lastResults = [];
let hasMore = false;
let loading = false;


/* =========================
   HELPERS
========================= */

function normalize(value) {

  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");

}


function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function getSetId(card) {

  if (card && card.set && card.set.id) {
    return card.set.id;
  }

  if (card && card.id) {
    return String(card.id).split("-")[0];
  }

  return "";

}


function getSetName(card) {

  if (card && card.set && card.set.name) {
    return card.set.name;
  }

  const id = getSetId(card);

  if (id && setsMap[id]) {
    return setsMap[id].name || "Set sconosciuto";
  }

  return "Set sconosciuto";

}


function cardImage(card) {

  if (card && card.image) {

    if (card.image.endsWith(".webp")) {
      return card.image;
    }

    return card.image + "/high.webp";
  }

  if (!card || !card.id) {
    return "";
  }

  return (
    "https://assets.tcgdex.net/" +
    currentLang +
    "/" +
    card.id.replace(/-/g, "/") +
    "/high.webp"
  );

}


function languageName(lang) {

  if (lang === "it") return "🇮🇹 Italiano";
  if (lang === "en") return "🇬🇧 Inglese";
  if (lang === "ja") return "🇯🇵 Giapponese";

  return lang;

}


/* =========================
   WISHLIST
========================= */

function getWishlist() {

  try {

    return JSON.parse(
      localStorage.getItem(WISHLIST_KEY) || "[]"
    );

  } catch {

    return [];

  }

}


function saveWishlist(items) {

  localStorage.setItem(
    WISHLIST_KEY,
    JSON.stringify(items)
  );

}


function addToWishlist(card) {

  if (!card || !card.id) {
    return;
  }

  const wishlist = getWishlist();

  const language =
    card.displayLanguage || currentLang;

  const exists = wishlist.some(item =>

    String(item.cardId || item.id) ===
      String(card.id)

    &&

    String(item.language || "it") ===
      String(language)

  );

  if (exists) {

    document.getElementById("status").textContent =
      "Carta già presente nella Wishlist.";

    return;
  }

  const wishlistCard = {

    id:
      card.id +
      "-" +
      language +
      "-" +
      Date.now(),

    cardId: card.id,

    name:
      card.displayName ||
      card.name ||
      "Carta senza nome",

    localId:
      card.localId || "",

    set:
      card.set || null,

    setName:
      getSetName(card),

    language:
      language,

    image:
      cardImage(card),

    addedAt:
      new Date().toISOString()

  };

  wishlist.push(wishlistCard);

  saveWishlist(wishlist);

  document.getElementById("status").textContent =
    wishlistCard.name +
    " aggiunta alla Wishlist.";

}


/* =========================
   SETS
========================= */

async function loadSets(language) {

  try {

    const response =
      await fetch(
        API + "/" + language + "/sets"
      );

    if (!response.ok) {
      throw new Error("Set error");
    }

    const data =
      await response.json();

    allSets =
      Array.isArray(data)
        ? data
        : [];

    setsMap = {};

    allSets.forEach(set => {

      if (set && set.id) {
        setsMap[set.id] = set;
      }

    });

    populateSetSelect();

  } catch (error) {

    console.error(error);

    allSets = [];
    setsMap = {};

    populateSetSelect();

  }

}


function populateSetSelect() {

  const select =
    document.getElementById("setSelect");

  select.innerHTML =
    '<option value="">Tutti i set</option>';

  const sorted =
    [...allSets].sort((a, b) =>

      String(a.name || "").localeCompare(
        String(b.name || ""),
        currentLang === "ja" ? "ja" : "it"
      )

    );

  sorted.forEach(set => {

    if (!set || !set.id) {
      return;
    }

    const option =
      document.createElement("option");

    option.value = set.id;

    option.textContent =
      set.name || set.id;

    select.appendChild(option);

  });

}


/* =========================
   CARD DATA
========================= */

async function getCard(cardId, language) {

  try {

    const response =
      await fetch(
        API +
        "/" +
        language +
        "/cards/" +
        encodeURIComponent(cardId)
      );

    if (!response.ok) {
      return null;
    }

    return await response.json();

  } catch {

    return null;

  }

}


async function getItalianCard(cardId) {

  return getCard(cardId, "it");

}


/* =========================
   SEARCH
========================= */

async function searchCards(reset = true) {

  if (loading) {
    return;
  }

  const input =
    document.getElementById("searchInput");

  const status =
    document.getElementById("status");

  const query =
    input.value.trim();

  if (reset) {

    currentPage = 1;
    currentQuery = query;

    lastResults = [];

    document.getElementById("results").innerHTML = "";

    document.getElementById("loadMoreWrap").style.display =
      "none";

  }

  if (!query && !currentSetId) {

    status.textContent =
      "Inserisci un numero o un nome per cercare.";

    return;

  }

  loading = true;

  status.textContent =
    "Ricerca in corso...";


  try {

    let results = [];


    /* SET SELEZIONATO */

    if (currentSetId) {

      const response =
        await fetch(
          API +
          "/" +
          currentLang +
          "/sets/" +
          encodeURIComponent(currentSetId)
        );

      if (response.ok) {

        const set =
          await response.json();

        let cards =
          Array.isArray(set.cards)
            ? set.cards
            : [];


        if (query) {

          const q =
            normalize(query);

          cards =
            cards.filter(card => {

              const name =
                normalize(card.name);

              const number =
                normalize(card.localId);

              return (
                name.includes(q) ||
                number.includes(q)
              );

            });

        }


        const start =
          (currentPage - 1) * PAGE_SIZE;

        const page =
          cards.slice(
            start,
            start + PAGE_SIZE
          );

        for (const brief of page) {

          const full =
            await getCard(
              brief.id,
              currentLang
            );

          if (!full) {
            continue;
          }

          if (currentLang !== "it") {

            const italian =
              await getItalianCard(full.id);

            if (italian && italian.name) {
              full.displayName =
                italian.name;
            }

          } else {

            full.displayName =
              full.name;

          }

          full.displayLanguage =
            currentLang;

          results.push(full);

        }

        hasMore =
          start + PAGE_SIZE < cards.length;

      }

    }

    /* NUMERO */

    else if (/^[0-9]+$/.test(query)) {

      const response =
        await fetch(
          API +
          "/" +
          currentLang +
          "/cards?localId=" +
          encodeURIComponent(query) +
          "&page=" +
          currentPage
        );

      if (response.ok) {

        const data =
          await response.json();

        results =
          Array.isArray(data)
            ? data
            : [];

      }

    }

    /* NOME */

    else {

      const response =
        await fetch(
          API +
          "/" +
          currentLang +
          "/cards?name=" +
          encodeURIComponent(query) +
          "&page=" +
          currentPage
        );

      if (response.ok) {

        const data =
          await response.json();

        results =
          Array.isArray(data)
            ? data
            : [];

      }

    }


    /* ITALIAN NAMES */

    for (const card of results) {

      if (currentLang === "it") {

        card.displayName =
          card.name ||
          "Carta senza nome";

      } else {

        const italian =
          await getItalianCard(card.id);

        card.displayName =
          italian && italian.name
            ? italian.name
            : card.name ||
              "Carta senza nome";

      }

      card.displayLanguage =
        currentLang;

    }


    lastResults =
      reset
        ? results
        : lastResults.concat(results);


    if (!currentSetId) {

      hasMore =
        results.length >= PAGE_SIZE;

    }


    renderResults();


    status.textContent =
      lastResults.length +
      " carte trovate.";


  } catch (error) {

    console.error(error);

    status.textContent =
      "Errore durante la ricerca.";

  }


  loading = false;

}


/* =========================
   RENDER
========================= */

function renderResults() {

  const container =
    document.getElementById("results");

  if (!lastResults.length) {

    container.innerHTML =
      '<div class="empty">NESSUNA CARTA TROVATA.</div>';

    document.getElementById("loadMoreWrap").style.display =
      "none";

    return;

  }


  container.innerHTML =
    lastResults.map((card, index) => {

      const name =
        card.displayName ||
        card.name ||
        "Carta senza nome";

      const image =
        cardImage(card);

      return `

        <article
          class="catalog-card"
          data-index="${index}"
        >

          <img
            class="catalog-card-image"
            src="${escapeHtml(image)}"
            alt="${escapeHtml(name)}"
            loading="lazy"
          >

          <div class="catalog-card-name">
            ${escapeHtml(name)}
          </div>

          <div class="catalog-card-meta">

            ${escapeHtml(getSetName(card))}

            <br>

            ${escapeHtml(card.localId || "")}
            ·
            ${escapeHtml(
              languageName(
                card.displayLanguage ||
                currentLang
              )
            )}

          </div>

          <div class="catalog-actions">

            <button
              class="btn view-btn"
              type="button"
              data-card-id="${escapeHtml(card.id)}"
            >
              VIEW
            </button>

            <button
              class="btn wish-btn"
              type="button"
              data-card-id="${escapeHtml(card.id)}"
            >
              ♡ WISH
            </button>

            <button
              class="btn add-btn"
              type="button"
              data-card-id="${escapeHtml(card.id)}"
            >
              + COLL
            </button>

          </div>

        </article>

      `;

    }).join("");


  document.getElementById("loadMoreWrap").style.display =
    hasMore
      ? "flex"
      : "none";

}


/* =========================
   LOAD MORE
========================= */

async function loadMore() {

  if (loading || !hasMore) {
    return;
  }

  currentPage++;

  await searchCards(false);

}


/* =========================
   VIEW
========================= */

async function viewCard(cardId) {

  const card =
    await getCard(
      cardId,
      currentLang
    );

  if (!card) {

    alert("Carta non trovata.");

    return;

  }

  let name =
    card.name ||
    "Carta senza nome";

  if (currentLang !== "it") {

    const italian =
      await getItalianCard(cardId);

    if (italian && italian.name) {
      name = italian.name;
    }

  }

  alert(

    name +
    "\n\n" +

    "Numero: " +
    (card.localId || "-") +
    "\n" +

    "Set: " +
    getSetName(card) +
    "\n" +

    "Lingua: " +
    languageName(currentLang)

  );

}


/* =========================
   EVENTS
========================= */

document
  .getElementById("searchBtn")
  .addEventListener(
    "click",
    () => searchCards(true)
  );


document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        searchCards(true);
      }

    }
  );


document
  .getElementById("loadMoreBtn")
  .addEventListener(
    "click",
    loadMore
  );


document
  .getElementById("languageSelect")
  .addEventListener(
    "change",
    async event => {

      currentLang =
        event.target.value;

      currentSetId = "";

      currentPage = 1;

      lastResults = [];

      document.getElementById("results").innerHTML = "";

      document.getElementById("loadMoreWrap").style.display =
        "none";

      await loadSets(currentLang);

      document.getElementById("status").textContent =
        "Lingua cambiata. Premi SEARCH.";

    }
  );


document
  .getElementById("setSelect")
  .addEventListener(
    "change",
    event => {

      currentSetId =
        event.target.value;

      currentPage = 1;

      lastResults = [];

      document.getElementById("results").innerHTML = "";

      document.getElementById("loadMoreWrap").style.display =
        "none";

      document.getElementById("status").textContent =
        currentSetId
          ? "Set selezionato. Premi SEARCH."
          : "Inserisci un numero o un nome per cercare.";

    }
  );


/* =========================
   CARD BUTTONS
========================= */

document
  .getElementById("results")
  .addEventListener(
    "click",
    event => {

      const button =
        event.target.closest("button");

      if (!button) {
        return;
      }

      const cardId =
        button.dataset.cardId;

      if (!cardId) {
        return;
      }


      if (
        button.classList.contains("view-btn")
      ) {

        viewCard(cardId);

        return;

      }


      if (
        button.classList.contains("wish-btn")
      ) {

        const card =
          lastResults.find(
            item =>
              String(item.id) ===
              String(cardId)
          );

        if (card) {
          addToWishlist(card);
        }

        return;

      }


      if (
        button.classList.contains("add-btn")
      ) {

        window.location.href =
          "collection.html?add=" +
          encodeURIComponent(cardId) +
          "&lang=" +
          encodeURIComponent(currentLang);

      }

    }
  );


/* =========================
   INIT
========================= */

loadSets("it");


/* =========================
   SERVICE WORKER
========================= */

if (
  "serviceWorker" in navigator &&
  location.protocol !== "file:"
) {

  navigator.serviceWorker
    .register("./sw.js?v=15")
    .catch(() => {});

}

</script>
