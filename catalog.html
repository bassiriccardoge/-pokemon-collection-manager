<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pokémon Collection Manager — CATALOG</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0b1220">

  <style>
    .catalog-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 180px 260px auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }

    .catalog-toolbar input,
    .catalog-toolbar select {
      width: 100%;
      box-sizing: border-box;
    }

    .catalog-status {
      margin: 10px 0 18px;
      font-size: 13px;
      opacity: .8;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .catalog-card {
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.025);
      padding: 10px;
      min-width: 0;
    }

    .catalog-card-image {
      width: 100%;
      aspect-ratio: 0.72;
      object-fit: contain;
      display: block;
      background: #080d16;
      margin-bottom: 10px;
    }

    .catalog-card-name {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .catalog-card-meta {
      font-size: 12px;
      opacity: .75;
      line-height: 1.5;
      min-height: 38px;
    }

    .catalog-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 10px;
    }

    .catalog-actions .btn {
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      padding: 7px 5px;
      font-size: 11px;
    }

    .catalog-actions .wish-btn {
      grid-column: 1 / 2;
    }

    .catalog-actions .add-btn {
      grid-column: 2 / 3;
    }

    .catalog-actions .view-btn {
      grid-column: 1 / 3;
    }

    .load-more-wrap {
      display: flex;
      justify-content: center;
      margin: 22px 0;
    }

    .empty {
      grid-column: 1 / -1;
    }

    @media (max-width: 1000px) {
      .catalog-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .catalog-toolbar {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 700px) {
      .catalog-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .catalog-toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style>

</head>

<script>

const API = "https://api.tcgdex.net/v2";

const PAGE_SIZE = 40;

const WISHLIST_KEY = "pcm_wishlist";

let currentLang = "it";
let allSets = [];
let setsMap = {};

let currentPage = 1;
let currentQuery = "";
let currentSetId = "";

let loading = false;
let hasMore = false;

let lastResults = [];


/* =========================
   HELPERS
========================= */

function normalize(value) {
  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}


function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function cardImage(card) {

  if (card && card.image) {
    return card.image.endsWith(".webp")
      ? card.image
      : card.image + "/high.webp";
  }

  if (!card || !card.id) {
    return "";
  }

  return `https://assets.tcgdex.net/${currentLang}/${card.id.replace(/-/g, "/")}/high.webp`;
}


function getSetId(card) {

  if (card && card.set && card.set.id) {
    return card.set.id;
  }

  if (card && card.id) {
    return String(card.id).split("-")[0];
  }

  return "";
}


function getSetName(card) {

  if (card && card.set && card.set.name) {
    return card.set.name;
  }

  const setId = getSetId(card);

  if (setId && setsMap[setId]) {
    return setsMap[setId].name || "Set sconosciuto";
  }

  return "Set sconosciuto";
}


function languageName(lang) {

  if (lang === "it") return "🇮🇹 Italiano";
  if (lang === "en") return "🇬🇧 Inglese";
  if (lang === "ja") return "🇯🇵 Giapponese";

  return lang;
}


/* =========================
   WISHLIST
========================= */

function getWishlist() {

  try {
    return JSON.parse(
      localStorage.getItem(WISHLIST_KEY) || "[]"
    );
  } catch {
    return [];
  }
}


function saveWishlist(items) {

  localStorage.setItem(
    WISHLIST_KEY,
    JSON.stringify(items)
  );
}


function addToWishlist(card) {

  if (!card || !card.id) return;

  const wishlist = getWishlist();

  const language =
    card.displayLanguage || currentLang;

  const alreadyExists = wishlist.some(item =>
    String(item.cardId || item.id) === String(card.id) &&
    String(item.language || "it") === String(language)
  );

  if (alreadyExists) {

    document.getElementById("status").textContent =
      "Carta già presente nella Wishlist.";

    return;
  }

  const wishlistCard = {

    id: `${card.id}-${language}-${Date.now()}`,

    cardId: card.id,

    name: card.name || "Carta senza nome",

    localId: card.localId || "",

    set: card.set || null,

    setName: getSetName(card),

    language: language,

    image: cardImage(card),

    addedAt: new Date().toISOString()

  };

  wishlist.push(wishlistCard);

  saveWishlist(wishlist);

  document.getElementById("status").textContent =
    `${wishlistCard.name} aggiunta alla Wishlist.`;
}


/* =========================
   SETS
========================= */

async function loadSets(language = currentLang) {

  try {

    const response =
      await fetch(`${API}/${language}/sets`);

    if (!response.ok) {
      throw new Error("Errore caricamento set");
    }

    const data = await response.json();

    allSets = Array.isArray(data)
      ? data
      : [];

    setsMap = {};

    allSets.forEach(set => {

      if (set && set.id) {
        setsMap[set.id] = set;
      }

    });

    populateSetSelect();

  } catch (error) {

    console.error(error);

    allSets = [];
    setsMap = {};

    populateSetSelect();
  }
}


function populateSetSelect() {

  const select =
    document.getElementById("setSelect");

  select.innerHTML =
    `<option value="">Tutti i set</option>`;

  const sorted =
    [...allSets].sort((a, b) =>
      String(a.name || "")
        .localeCompare(
          String(b.name || ""),
          currentLang === "ja" ? "ja" : "it"
        )
    );

  sorted.forEach(set => {

    if (!set || !set.id) return;

    const option =
      document.createElement("option");

    option.value = set.id;

    option.textContent =
      set.name || set.id;

    select.appendChild(option);
  });
}


function findSetById(id) {

  return allSets.find(
    set => String(set.id) === String(id)
  );
}


/* =========================
   LOCALIZATION
========================= */

async function getItalianCard(cardId) {

  if (!cardId) return null;

  try {

    const response =
      await fetch(`${API}/it/cards/${encodeURIComponent(cardId)}`);

    if (!response.ok) {
      return null;
    }

    return await response.json();

  } catch {

    return null;
  }
}


async function getLanguageCard(cardId, language) {

  if (!cardId) return null;

  try {

    const response =
      await fetch(
        `${API}/${language}/cards/${encodeURIComponent(cardId)}`
      );

    if (!response.ok) {
      return null;
    }

    return await response.json();

  } catch {

    return null;
  }
}


async function localizeOneCard(card) {

  if (!card) return null;

  card.displayLanguage = currentLang;

  if (currentLang === "it") {
    return card;
  }

  const italian =
    await getItalianCard(card.id);

  if (italian && italian.name) {
    card.displayName = italian.name;
  } else {
    card.displayName = card.name || "Carta senza nome";
  }

  return card;
}


async function localizeResults(cards) {

  const output = [];

  for (const card of cards) {

    const localized =
      await localizeOneCard(card);

    if (localized) {
      output.push(localized);
    }
  }

  return output;
}


/* =========================
   SEARCH
========================= */

async function searchByName(query) {

  try {

    const response =
      await fetch(
        `${API}/${currentLang}/cards?name=${encodeURIComponent(query)}&page=1`
      );

    if (!response.ok) {
      return [];
    }

    const data =
      await response.json();

    return Array.isArray(data)
      ? data
      : [];

  } catch {

    return [];
  }
}


async function searchByNumber(query) {

  try {

    const response =
      await fetch(
        `${API}/${currentLang}/cards?localId=${encodeURIComponent(query)}&page=${currentPage}`
      );

    if (!response.ok) {
      return [];
    }

    const data =
      await response.json();

    return Array.isArray(data)
      ? data
      : [];

  } catch {

    return [];
  }
}


async function searchInsideSet(query, setId) {

  try {

    const response =
      await fetch(
        `${API}/${currentLang}/sets/${encodeURIComponent(setId)}`
      );

    if (!response.ok) {
      return [];
    }

    const set =
      await response.json();

    const cards =
      Array.isArray(set.cards)
        ? set.cards
        : [];

    if (!query) {
      return cards;
    }

    const normalizedQuery =
      normalize(query);

    const output = [];

    for (const brief of cards) {

      if (!brief || !brief.id) continue;

      const card =
        await getLanguageCard(
          brief.id,
          currentLang
        );

      if (!card) continue;

      let name =
        card.name || "";

      if (currentLang !== "it") {

        const italian =
          await getItalianCard(card.id);

        if (italian && italian.name) {
          name = italian.name;
        }
      }

      const matchesName =
        normalize(name).includes(normalizedQuery);

      const matchesNumber =
        normalize(card.localId).includes(normalizedQuery);

      if (matchesName || matchesNumber) {

        card.displayName = name;
        card.displayLanguage = currentLang;

        output.push(card);
      }
    }

    return output;

  } catch {

    return [];
  }
}


async function searchExactCard(query) {

  try {

    const card =
      await getLanguageCard(
        query,
        currentLang
      );

    if (!card) {
      return [];
    }

    return [card];

  } catch {

    return [];
  }
}


/* =========================
   MAIN SEARCH
========================= */

async function searchCards(reset = true) {

  if (loading) return;

  const input =
    document.getElementById("searchInput");

  const query =
    input.value.trim();

  const status =
    document.getElementById("status");

  if (reset) {

    currentPage = 1;
    currentQuery = query;
    lastResults = [];

    document.getElementById("results").innerHTML = "";

    document.getElementById("loadMoreWrap").style.display =
      "none";
  }

  currentQuery = query;

  if (!query && !currentSetId) {

    status.textContent =
      "Inserisci un numero o un nome per cercare.";

    return;
  }

  loading = true;

  status.textContent =
    "Ricerca in corso...";

  let results = [];

  try {

    if (currentSetId) {

      results =
        await searchInsideSet(
          query,
          currentSetId
        );

    } else if (/^[0-9]+$/.test(query)) {

      results =
        await searchByNumber(query);

    } else if (/^[a-z0-9]+-[0-9]+$/i.test(query)) {

      results =
        await searchExactCard(query);

    } else {

      results =
        await searchByName(query);
    }

    if (currentLang !== "it") {

      results =
        await localizeResults(results);

    } else {

      results =
        results.map(card => {

          card.displayLanguage = currentLang;
          card.displayName =
            card.name || "Carta senza nome";

          return card;

        });
    }

    lastResults =
      reset
        ? results
        : [...lastResults, ...results];

    hasMore =
      results.length >= PAGE_SIZE;

    renderResults();

    if (!results.length) {

      status.textContent =
        "Nessuna carta trovata.";

    } else {

      status.textContent =
        `${lastResults.length} carte trovate.`;
    }

  } catch (error) {

    console.error(error);

    status.textContent =
      "Errore durante la ricerca.";

  } finally {

    loading = false;
  }
}


/* =========================
   RENDER
========================= */

function renderResults() {

  const container =
    document.getElementById("results");

  const loadMoreWrap =
    document.getElementById("loadMoreWrap");

  if (!lastResults.length) {

    container.innerHTML =
      `<div class="empty">NESSUNA CARTA TROVATA.</div>`;

    loadMoreWrap.style.display =
      "none";

    return;
  }

  container.innerHTML =
    lastResults.map((card, index) => {

      const name =
        card.displayName ||
        card.name ||
        "Carta senza nome";

      const setName =
        getSetName(card);

      const localId =
        card.localId || "";

      const image =
        cardImage(card);

      return `

        <article
          class="catalog-card"
          data-index="${index}"
        >

          <img
            class="catalog-card-image"
            src="${escapeHtml(image)}"
            alt="${escapeHtml(name)}"
            loading="lazy"
            onerror="this.style.visibility='hidden'"
          >

          <div class="catalog-card-name">
            ${escapeHtml(name)}
          </div>

          <div class="catalog-card-meta">
            ${escapeHtml(setName)}<br>
            ${escapeHtml(localId)} ·
            ${escapeHtml(languageName(card.displayLanguage || currentLang))}
          </div>

          <div class="catalog-actions">

            <button
              class="btn view-btn"
              type="button"
              data-card-id="${escapeHtml(card.id)}"
            >
              VIEW
            </button>

            <button
              class="btn wish-btn"
              type="button"
              data-card-id="${escapeHtml(card.id)}"
            >
              ♡ WISH
            </button>

            <button
              class="btn add-btn"
              type="button"
              data-card-id="${escapeHtml(card.id)}"
            >
              + COLL
            </button>

          </div>

        </article>
      `;

    }).join("");

  loadMoreWrap.style.display =
    hasMore
      ? "flex"
      : "none";
}


/* =========================
   LOAD MORE
========================= */

async function loadMore() {

  if (loading || !hasMore) return;

  currentPage++;

  await searchCards(false);
}


/* =========================
   VIEW
========================= */

async function viewCard(cardId) {

  const card =
    await getLanguageCard(
      cardId,
      currentLang
    );

  if (!card) {

    alert("Carta non trovata.");

    return;
  }

  let name =
    card.name || "Carta senza nome";

  if (currentLang !== "it") {

    const italian =
      await getItalianCard(cardId);

    if (italian && italian.name) {
      name = italian.name;
    }
  }

  const setName =
    getSetName(card);

  alert(
    `${name}\n\n` +
    `Numero: ${card.localId || "-"}\n` +
    `Set: ${setName}\n` +
    `Lingua: ${languageName(currentLang)}`
  );
}


/* =========================
   COLLECTION
========================= */

function addToCollection(cardId) {

  window.location.href =
    `collection.html?add=${encodeURIComponent(cardId)}&lang=${encodeURIComponent(currentLang)}`;
}


/* =========================
   EVENTS
========================= */

document
  .getElementById("searchBtn")
  .addEventListener("click", () => {

    searchCards(true);

  });


document
  .getElementById("searchInput")
  .addEventListener("keydown", event => {

    if (event.key === "Enter") {

      searchCards(true);

    }

  });


document
  .getElementById("languageSelect")
  .addEventListener("change", async event => {

    currentLang =
      event.target.value;

    currentSetId = "";

    document
      .getElementById("setSelect")
      .value = "";

    document
      .getElementById("results")
      .innerHTML = "";

    document
      .getElementById("loadMoreWrap")
      .style.display = "none";

    lastResults = [];

    currentPage = 1;

    await loadSets(currentLang);

    const status =
      document.getElementById("status");

    status.textContent =
      "Lingua cambiata. Inserisci un numero o un nome per cercare.";

  });


document
  .getElementById("setSelect")
  .addEventListener("change", event => {

    currentSetId =
      event.target.value;

    currentPage = 1;

    lastResults = [];

    document
      .getElementById("results")
      .innerHTML = "";

    document
      .getElementById("loadMoreWrap")
      .style.display = "none";

    if (currentSetId) {

      document
        .getElementById("status")
        .textContent =
        "Set selezionato. Premi SEARCH.";

    }

  });


document
  .getElementById("loadMoreBtn")
  .addEventListener("click", () => {

    loadMore();

  });


document
  .getElementById("results")
  .addEventListener("click", event => {

    const button =
      event.target.closest("button");

    if (!button) return;

    const cardId =
      button.dataset.cardId;

    if (!cardId) return;

    if (button.classList.contains("view-btn")) {

      viewCard(cardId);

      return;
    }

    if (button.classList.contains("wish-btn")) {

      const card =
        lastResults.find(
          item => String(item.id) === String(cardId)
        );

      if (card) {
        addToWishlist(card);
      }

      return;
    }

    if (button.classList.contains("add-btn")) {

      addToCollection(cardId);

      return;
    }

  });


/* =========================
   INIT
========================= */

(async function init() {

  await loadSets("it");

})();


/* =========================
   SERVICE WORKER
========================= */

if (
  "serviceWorker" in navigator &&
  location.protocol !== "file:"
) {

  navigator.serviceWorker
    .register("./sw.js?v=14")
    .catch(() => {});

}

</script>
