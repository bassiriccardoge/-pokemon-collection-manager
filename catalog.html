<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Pokémon Collection Manager — CATALOG</title>

  <link rel="manifest" href="./manifest.webmanifest">

  <meta name="theme-color" content="#0b1220">

  <style>
    .search-box {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px minmax(220px, 320px) auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-field {
      min-width: 0;
    }

    .search-label {
      display: block;
      margin-bottom: 6px;
      font-size: 11px;
      letter-spacing: 1px;
      color: #94a3b8;
    }

    .search-box input,
    .search-box select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      background: #0b1220;
      color: #fff;
      border: 1px solid #334155;
      font: inherit;
      border-radius: 0;
    }

    .search-box input:focus,
    .search-box select:focus {
      outline: none;
      border-color: #60a5fa;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .catalog-card {
      border: 1px solid #334155;
      background: #111827;
      padding: 10px;
      cursor: pointer;
    }

    .catalog-card:hover {
      border-color: #60a5fa;
    }

    .catalog-card img {
      width: 100%;
      display: block;
      aspect-ratio: 0.716;
      object-fit: contain;
      background: #0b1220;
    }

    .catalog-info {
      padding-top: 10px;
    }

    .catalog-name {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .catalog-meta {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
    }

    .catalog-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .catalog-actions button {
      flex: 1;
      min-width: 70px;
      cursor: pointer;
    }

    .empty-state {
      border: 1px solid #334155;
      padding: 30px;
      color: #94a3b8;
      text-align: center;
      grid-column: 1 / -1;
    }

    .load-more-wrap {
      text-align: center;
      margin-top: 24px;
    }

    .load-more-wrap .btn {
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .search-box {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .search-box {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
