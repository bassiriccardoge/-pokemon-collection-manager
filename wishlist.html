<script>

const WISHLIST_KEY =
  "pcm_wishlist";

const COLLECTION_KEY =
  "pcm_collection";


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function getWishlist() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(
          WISHLIST_KEY
        ) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  } catch {

    return [];

  }

}


function saveWishlist(items) {

  localStorage.setItem(
    WISHLIST_KEY,
    JSON.stringify(items)
  );

}


function getCollection() {

  try {

    const data =
      JSON.parse(
        localStorage.getItem(
          COLLECTION_KEY
        ) || "[]"
      );

    return Array.isArray(data)
      ? data
      : [];

  } catch {

    return [];

  }

}


function saveCollection(items) {

  localStorage.setItem(
    COLLECTION_KEY,
    JSON.stringify(items)
  );

}


function languageName(lang) {

  if (lang === "it") {
    return "Italiano";
  }

  if (lang === "en") {
    return "Inglese";
  }

  if (lang === "ja") {
    return "Giapponese";
  }

  return lang || "—";

}


function cardImage(card) {

  if (
    card &&
    card.image
  ) {

    if (
      card.image.endsWith(".png") ||
      card.image.endsWith(".jpg") ||
      card.image.endsWith(".jpeg") ||
      card.image.endsWith(".webp")
    ) {

      return card.image;

    }

    return card.image + "/high.webp";

  }


  if (
    card &&
    card.cardId
  ) {

    return (
      `https://assets.tcgdex.net/en/` +
      `${card.cardId.replace(/-/g, "/")}` +
      `/high.webp`
    );

  }


  return "";

}


/* =========================================================
   REMOVE FROM WISHLIST
========================================================= */

function removeFromWishlist(index) {

  const wishlist =
    getWishlist();


  if (
    !wishlist[index]
  ) {

    return;

  }


  wishlist.splice(
    index,
    1
  );


  saveWishlist(
    wishlist
  );


  renderWishlist();

}


/* =========================================================
   MOVE TO COLLECTION
========================================================= */

function moveToCollection(index) {

  const wishlist =
    getWishlist();


  const card =
    wishlist[index];


  if (!card) {

    return;

  }


  const collection =
    getCollection();


  const collectionCard = {

    id:
      `${card.cardId || card.id}-${Date.now()}`,

    cardId:
      card.cardId ||
      card.id ||
      "",

    name:
      card.name ||
      "",

    localId:
      card.localId ||
      "",

    set:
      card.set ||
      null,

    setName:
      card.setName ||
      "Set sconosciuto",

    language:
      card.language ||
      "it",

    condition:
      "NM",

    quantity:
      1,

    grading:
      "Raw",

    grade:
      "",

    purchasePrice:
      "",

    purchaseDate:
      "",

    seller:
      "",

    notes:
      "",

    savedAt:
      new Date().toISOString()

  };


  collection.push(
    collectionCard
  );


  saveCollection(
    collection
  );


  /*
    Importante:
    quando una carta viene spostata
    nella Collection viene rimossa
    automaticamente dalla Wishlist.
  */

  wishlist.splice(
    index,
    1
  );


  saveWishlist(
    wishlist
  );


  renderWishlist();

}


/* =========================================================
   RENDER WISHLIST
========================================================= */

function renderWishlist() {

  const container =
    document.getElementById(
      "wishlistList"
    );


  if (!container) {

    return;

  }


  const wishlist =
    getWishlist();


  if (
    !wishlist.length
  ) {

    container.innerHTML = `

      <div class="empty-state">

        Wishlist vuota.

        <br><br>

        Vai nel Catalogo e premi
        <strong>♡ WISH</strong>
        su una carta per aggiungerla.

      </div>

    `;

    return;

  }


  container.innerHTML =
    wishlist
      .map(
        (card, index) => {

          const image =
            cardImage(card);


          const name =
            card.name ||
            "Carta senza nome";


          const localId =
            card.localId ||
            "—";


          const setName =
            card.setName ||
            "Set sconosciuto";


          const language =
            languageName(
              card.language
            );


          return `

            <div
              class="wishlist-card"
            >

              ${
                image
                  ? `

                    <img
                      src="${escapeHtml(image)}"
                      alt="${escapeHtml(name)}"
                      loading="lazy"
                      onerror="this.style.display='none';"
                    >

                  `
                  : `

                    <div class="fakecard">
                      NO IMAGE
                    </div>

                  `
              }


              <div class="wishlist-info">

                <div class="wishlist-name">

                  ${escapeHtml(name)}

                </div>


                <div class="wishlist-meta">

                  ${escapeHtml(setName)}

                  <br>

                  Nº ${escapeHtml(localId)}

                  <br>

                  ${escapeHtml(language)}

                </div>


                <div class="wishlist-actions">

                  <button
                    class="btn secondary"
                    type="button"
                    onclick="moveToCollection(${index})"
                  >
                    + COLLECTION
                  </button>


                  <button
                    class="btn"
                    type="button"
                    onclick="removeFromWishlist(${index})"
                  >
                    × REMOVE
                  </button>

                </div>

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================================================
   INIT
========================================================= */

renderWishlist();


/* =========================================================
   SERVICE WORKER
========================================================= */

if (
  "serviceWorker" in navigator &&
  location.protocol !== "file:"
) {

  navigator.serviceWorker
    .register(
      "./sw.js?v=14"
    )
    .catch(
      () => {}
    );

}

</script>
